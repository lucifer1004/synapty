[content]
description = "Systematic UI upgrade targeting the fit-and-finish of Apple's built-in macOS apps (Finder / Notes / Terminal). Four layers: (A) window chrome — hidden title bar with full-size content, traffic lights floating over a vibrancy sidebar (NSVisualEffectView .sidebar material, behind-window blending), drag region preserved; (B) design tokens — align DS surfaces/hover/selection/borders with system semantic colors and materials while keeping the teal brand accent; (C) component polish — sidebar rows use native selection, nav rail states, pane tabs, status bar hairlines + materials, sheet/button idioms, subtle hover/selection animations honoring Reduce Motion; (D) page-level consistency — Hosts/Tasks/Activity/Hub/Settings share one header + grouped-card pattern, ContentUnavailableView empty states (macOS 14+). Terminal surfaces stay opaque Metal; the HStack layout (not NavigationSplitView, WI-2026-08-07-006) is preserved."

