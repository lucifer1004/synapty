Product feedback: (1) the opacity row shows no icon — the "opacity" SF Symbol does not exist in the current system (verified via NSImage: MISSING), so it renders blank; (2) the theme pickers are 150pt wide while the font picker stretches — inconsistent.

Fix: use the "drop" symbol for opacity (verified present); ThemePicker gains a nil-width mode (stretch to the row width) and the panel's Light/Dark pickers use it, matching the font picker. The Settings page keeps the fixed 150pt pair (SettingsThemeControls passes it explicitly)."""

