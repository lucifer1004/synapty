status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "A leaf reports its own host after being moved between tabs and between workspaces, verified for the file-drop destination, the presentation-plane origin, the agent lifecycle record and the remote pwd query"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "No accessor remains that answers a host question from a tab or workspace — the compiler is the check, not a convention"
status = "done"
category = "removed"

[[content.acceptance_criteria]]
text = "Local is modelled as a connection, so no consumer branches on the absence of a host to ask which machine a leaf is on"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "A connection is released only after its last leaf goes and a stated grace period elapses — closing one of two panes on a host leaves the other's link up"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "changed: A store the current shape does not recognise is discarded and the workbench opens fresh — no conversion path exists to carry"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
