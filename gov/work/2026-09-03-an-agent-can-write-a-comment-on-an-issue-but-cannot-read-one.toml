#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-09-03-011"
title = "An agent can write a comment on an issue but cannot read one"
status = "done"
created = "2026-09-03"
started = "2026-09-03"
completed = "2026-09-03"
refs = [
    "RFC-0003:C-CLI-TOOLS",
    "RFC-0003:C-ISSUE-STATES",
]

[content]
description = """
The task queue is one-way for discussion. An agent can POST a comment onto an
issue and cannot GET one back, so anything a human writes on an issue — the
answer to a question the agent asked there, a change of mind about scope, a
correction — is invisible to every agent that reads the queue.

Verified at each layer rather than inferred; nothing is broken, the path was
never built:

- `src/github.zig` has `listIssues` (GET /issues) and `addComment`
  (POST /issues/{n}/comments). There is no GET of /issues/{n}/comments.
- `src/tools.zig` `isCredentialTool` admits task.list, task.claim,
  task.update, task.comment and task.create. There is no task.comments.
- The CLI offers `list create claim comment update`, and `comment` writes.
  No verb reads.
- The GUI has no comments surface at all; the only occurrence is the
  ActivityLog icon for a `task.comment` the agent itself sent.
- `task list` returns number, title, state, url and labels. Not even the
  issue body comes back, so an agent working from the queue is working from
  a title.

Reported as hub issue #6, "[Synapty] cannot fetch issue comments".

THIS IS A SCOPE QUESTION, NOT AN IMPLEMENTATION DEBT.
[[RFC-0003:C-CLI-TOOLS]] enumerates the subcommands that ARE the agent
interface, and reading discussion is not among them — so no clause has been
missed and none is unimplemented. The clause has to grow before the code does."""
notes = [
    "SHAPE STILL OPEN, and the clause is what settles it. Two candidates were on the table when this was written: a `task comments <n>` that returns only the discussion, or a `task show <n>` that returns the issue's body and its comments together. The second is the recommendation — an agent handed an issue number wants to know what the issue SAYS, and body-plus-discussion is one round trip instead of two — but it is a contract decision and belongs in the clause, not in whichever function gets written first.",
    "NOT A REGRESSION AND NOT URGENT. Nothing that used to work has stopped; agents have never been able to read discussion. The cost is quiet rather than loud: a human answers an agent's question on the issue and the agent never sees the answer, which looks like the agent ignoring them.",
    "SETTLED AS `task show <issue>`, per the recommendation the clause was asked to weigh: body and comments together, because an agent handed an issue number wants to know what the issue SAYS and one round trip answers that where two would. The clause carries the reasoning now, not this work item.",
    "THE HUB AND THE WORKBENCH BOTH HAVE TO BE THE NEW BUILD. A credential tool is routed by the hub and executed by the workbench, so the running pair decides whether the verb exists: the production hub, an older process, answers `unknown tool`, while a hub built from this source answers `no workbench available` — which is the routing working and the executor absent. `synapty tools exec --tool task.show` proves the executor on its own.",
    "Verified live against the project's own hub repository rather than only against fixtures. One issue came back with its 834-character body and all ten of its comments, each carrying author, body and created_at, in the ascending created_at order the forge holds them in; another, which has neither body nor comments, came back as an empty list and exit 0.",
]

[[content.acceptance_criteria]]
text = "src/github.zig fetches GET /repos/{owner}/{repo}/issues/{n}/comments and surfaces the same ApiError vocabulary the existing calls use"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "the read is a credential tool — src/tools.zig admits it, so it is served where the token is and never by a pane"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "an agent in a pane can read an issue's body and its comments through one CLI call, JSON on stdout and exit 0 ([[RFC-0003:C-CLI-TOOLS]] output contract)"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "an issue with no comments is an empty list and exit 0, not an error — a question nobody has answered yet is the ordinary case"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "the verb against an issue carrying comments returns each one's author and body, in the order GitHub gave them"
status = "done"
category = "chore"

[[content.acceptance_criteria]]
text = "with no hub the verb answers in a sentence and exits 4, like every other tool verb (scripts/test-send-answer-e2e.sh already asserts this shape)"
status = "done"
category = "chore"

[[content.acceptance_criteria]]
text = "PRECONDITION FOR EVERY ITEM ABOVE — [[RFC-0003:C-CLI-TOOLS]] names the read verb, its output contract, and what it returns for an issue nobody has commented on. The clause enumerates the agent interface, so the interface cannot grow past it."
status = "done"
category = "chore"
