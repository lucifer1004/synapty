[content]
description = "User request 2026-08-09: session/tab/pane each get a direct-jump shortcut tier plus press-and-hold hints. Scheme: cmd+N sessions (unchanged), cmd+opt+N tabs (WI-2026-08-09-012's Arrange presets give up cmd+opt+1-4 and stay menu-only), cmd+ctrl+N focuses the Nth split leaf of the active tab. A local flagsChanged monitor (ModifierHintState) shows number badges on the matching level after a 350ms hold — the delay keeps ordinary chords (cmd+C) from flashing badges; release hides instantly. Digit handling runs in a local keyDown monitor (the reliable layer — performKeyEquivalent-consuming terminals bypass menu shortcuts)."

