[content]
description = "Terminal-affecting settings (Appearance, light/dark themes, font family/size, background opacity, cursor style) are buried in the Settings page. Add a collapsible right-hand panel — default closed, toggled by a terminal-page header button or Cmd+Option+P, state persisted — that docks on the Terminal page (terminal shrinks) and floats on other pages, binding the same SynaptySettings so every change applies live through the existing reload chain. Opacity slider debounced (~100ms) to avoid reload storms while dragging."

