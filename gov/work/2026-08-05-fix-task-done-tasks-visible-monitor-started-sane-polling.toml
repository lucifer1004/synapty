[content]
description = "Task center surfaced several gaps: done issues were invisible (hub task list defaulted to open-only), TaskMonitor was never started so the tasks page stayed empty, and polling hammered GitHub. Default hub task listing to all states, start the monitor from the app, and split activity (5s) vs task (60s) polling with a manual refresh."

[[content.acceptance_criteria]]
text = "hub task list returns closed/done issues by default (state=all)"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "task monitor starts with the app so the tasks page populates without manual action"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "activity vs task polling split (5s/60s) plus manual refresh"
status = "done"
category = "changed"
