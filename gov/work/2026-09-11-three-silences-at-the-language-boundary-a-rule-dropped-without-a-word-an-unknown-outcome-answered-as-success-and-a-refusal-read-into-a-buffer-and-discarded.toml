status = "done"
category = "chore"

[[content.acceptance_criteria]]
text = "synapty exec answers 9 rather than 0 for an outcome this build does not know, or a malformed response"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "the exec exit-code table is pinned for all nine outcomes, the unknown one and a malformed answer"
status = "done"
category = "chore"

[[content.acceptance_criteria]]
text = "the five workbench-to-hub one-shots log the hub's refusal with its own words instead of reading it into a buffer and discarding it"
status = "done"
category = "fixed"
