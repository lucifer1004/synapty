[content]
description = """Termius's top search doubles as a connect entry ("Find a host or ssh user@hostname..."); Synapty adopts the stronger form: a Cmd+K command-palette overlay available from EVERY page (user request, follows WI-2026-08-08-090). One DS-styled floating panel (ultraThinMaterial, DSInputChrome field, top-center like Spotlight): typing filters saved hosts (label/address/tags, case-insensitive substring; reuse HostStore.searchHosts) with keyboard navigation (arrows + Enter, Esc closes); when the input parses as an ssh target (user@host[:port], or plain host[:port]) the FIRST row becomes "Connect to <target>" — Enter opens an ad-hoc terminal session via the existing host-connect path WITHOUT persisting a HostEntry, and the result row offers a secondary "Save as host…" action that opens the host editor prefilled. Selecting a saved host row connects exactly like double-clicking its card. Wiring: Cmd+K in SynaptyCommands + a notification (same pattern as synaptyShowPage); palette state lives in ContentView; local terminal stays reachable by an always-present "Local Terminal" row when the query is empty. Happy-path V1: no MRU ranking, no fuzzy scoring beyond substring, no ssh-config completion."""

