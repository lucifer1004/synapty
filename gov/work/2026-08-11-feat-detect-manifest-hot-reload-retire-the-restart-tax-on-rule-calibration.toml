description = "herdr's calibration loop is read pane -> edit rule -> hot reload -> verify; ours is edit -> rebuild/relaunch, and post-v2 the manifests ARE the calibration surface, so the restart tax now dominates tuning. Scope: watch ~/.config/synapty/detect/ (DispatchSource file monitor), recompile a changed/added/removed manifest and swap the CompiledManifest atomically; per-tool edge-tracker memory resets on swap (a rule change is a new observer — its first classification is a legitimate edge). GOVERNANCE FIRST: ADR-0005 explicitly rules out hot reload for V1, so this WI's first deliverable is the govctl-managed amendment/supersession recording why the projection is reversed (v2 made manifests the tuning surface; the cost/benefit flipped). Origin: herdr gap analysis 2026-08-11 (tier 'cheap and high-value')."

