[content]
description = "Code-review P2: (1) PulseAnimation dims pulsing status dots to 0.4 opacity permanently when Reduce Motion is enabled (animation nil means the onAppear change applies instantly) — the intent was to disable the pulse, not the visibility; (2) icon-only buttons across the app (nav rail, plus, close, row actions) have no accessibilityLabel — VoiceOver reads nothing; (3) DS.textTertiary dark-mode value stays NSColor.tertiaryLabelColor at ~3.2:1 on dark surfaces while light mode was hand-tuned to 4.5:1."
notes = ["PulseAnimation keeps dots fully visible under Reduce Motion (pulse disabled, opacity 1); accessibilityLabel added to 8 icon-only buttons (host row edit/delete x2, new-session plus, new-pane plus, tab close, panel toggle, panel close); DS.textTertiary dark mode hand-tuned to 0.62 gray (~4.8:1 on dark surfaces, was ~3.2:1)."]

