status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "PortForward.sshFlag is gone — a second renderer of wireSpec whose doc described output it did not produce"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "Slot.isStacked is adopted at the call site that spelled it out, because its comment carries a warning the expression cannot"
status = "done"
