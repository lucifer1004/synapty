id = "WI-2026-08-08-047"
title = "fix(cli): storeToken feeds password+retype; treat empty Keychain token as absent"
status = "done"
created = "2026-08-08"
started = "2026-08-08"
completed = "2026-08-08"

[content]
description = "Root cause of '重新配置了但是没抓到 tasks': `security add-generic-password -w` (no value) reads the password from stdin as TWO prompts (password + retype); storeToken (WI-2026-08-08-028) wrote only one line, so security stored an EMPTY password (exit 0, password NULL). github status then reported hasToken:true (loadToken returns Some('') — an empty string is not null), and the hub's loadBridge used an empty Bearer -> 'github api error' -> no tasks in the GUI. Fix: feed the token twice (password + retype); treat an empty Keychain password as 'no token' in loadToken."
notes = ["ROOT CAUSE of '重新配置了但是没抓到 tasks': security add-generic-password -w (no value) reads password + RETYPE from stdin; storeToken wrote one line, so security stored an EMPTY password (exit 0, password NULL) -> github status hasToken false-positive -> hub used an empty Bearer -> 'github api error' -> no tasks. Fix: feed the token twice; detach the stdin File before wait (Zig 0.16 wait() double-closes pipe fds -> BADF panic); loadToken treats an empty password as 'no token'. Verified: zig store->load round trip returns the exact token; app CLI status now reports hasToken:false for the stale empty entry."]

[[content.acceptance_criteria]]
