#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-08-07-005"
title = "fix(gui): eliminate periodic UI stalls — async polling, change detection, layout isolation"
status = "done"
created = "2026-08-07"
started = "2026-08-07"
completed = "2026-08-08"

[content]
description = "The whole UI stuttered (main-thread blocks every 2-5s of 100ms-1s) and interactions froze. Root causes: (1) TaskMonitor/AgentMonitor ran synapty subprocesses synchronously on the main thread (waitUntilExit), freezing the UI on every poll; (2) even async, every poll unconditionally published @Published state (hub logs appended per agents request, activity events self-generated by the polls) forcing full-tree SwiftUI re-renders + layout (~100ms+); (3) hub logs churned on every agents poll. Fix: async subprocess execution with completion on the main actor, change-detection before publishing (tasks/activities/agents/needsAttention/bridgeStatus), hub log noise filtering + 1s throttled publishing, agents poll 5s. (Page-switch latency itself is tracked separately in WI-2026-08-07-006.)"

[[content.acceptance_criteria]]
text = "no main-thread blocks from periodic polling (subprocesses run off-main)"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "@Published state published only on real change (no churn re-renders)"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "hub log noise filtered and throttled"
status = "done"
category = "fixed"
