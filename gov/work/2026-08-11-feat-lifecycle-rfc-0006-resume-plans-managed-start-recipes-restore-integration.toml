[content]
description = "RFC-0006 implementation. Swift: resume plans recorded per agent-bearing pane (tool, cwd, host, incantation from per-tool template + validated resume_ref — allowlist validation per C-RESUME-PLAN), persisted with the session snapshot, observable drop triggers only; resume-on-restore (surface-ready wait, focus/typing skip-to-ask-first, one attempt no retry, resume-attempted marker, auto-resume preference visible w/ ask-first, remote panes demote to ask-first); managed-start launch recipes as per-tool data (spawn-argv delivery), 'start agent' affordance, workbench attribution marker, correlation-not-proof display. Resume templates + launch recipes ship for claude/codex/gemini (formats verified 2026-08-11). Depends on WI-2026-08-11-012 (resume_ref flows + identity continuity)."
notes = [
    "Live restart verification PASSED (2026-08-11 ~20:40): quit with the smoke claude's session on disk -> relaunch -> snapshot restored layout+cwd (~/Workspace/synapty) -> restore engine typed 'claude --resume 0017af01-...' + Enter (ps shows the exact process) -> claude re-attached the REAL previous conversation (full smoke transcript visible) -> SessionStart hook re-registered the SAME durable identity claude-0017af01 (RFC-0008 continuity as an identity property, live-proven) -> ResumeCoordinator re-captured the plan from the registration event and the 15s autosave persisted it (record->persist->restore->resume->re-record cycle closed). Screenshot in session records. Note: initial screenshot attempt captured the user's browser (Synapty was on another display) — deleted immediately; window-id capture used instead.",
    "Live finding (2026-08-11): the snapshot persisted RFC-0007 exec panes, restoring machine scratch space as unowned ordinary tabs after a restart. snapshot() now skips exec-pane tabs (activeTabIndex recomputed against the filtered list so it cannot point past the end). Regression test: testSnapshotExcludesExecPanes.",
]

