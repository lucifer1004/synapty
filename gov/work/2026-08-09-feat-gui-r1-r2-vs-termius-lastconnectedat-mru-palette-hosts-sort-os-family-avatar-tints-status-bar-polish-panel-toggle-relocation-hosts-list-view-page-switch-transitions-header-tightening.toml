[content]
description = "Closes the R1+R2 gap set from the Termius comparison round. R1: HostEntry.lastConnectedAt (Codable-tolerant) set by TunnelManager on the .connected transition via HostStore.markConnected; one recency comparator (HostStore.byRecency: recent first, never-connected last alphabetically) drives BOTH the Cmd+K palette ordering (empty query = MRU list; filtered results recency-sorted) and a Hosts-page sort control (Recent/Name, persisted). Avatar tints gain OS-family classes for scanability without trademark art (linux family = warm orange, windows = blue, macos = graphite; unknown keeps the per-host hash hue). ContextStatusBar aligned to the current language (xl gutters, quieter chips) and absorbs the Appearance-panel toggle as a labeled icon button (the floating titlebar-band toggle is deleted). Card press states are consciously DROPPED: gesture composition on .draggable blocks is a known crash class (WI-2026-08-08-076). R2: Hosts grid/list view toggle (persisted; shared HostAvatar component; list = card rows with dividers, same tap/double-click/drag/hover-action semantics), 150ms opacity page-switch transition (Reduce Motion honored; terminal dock stays instant — WI-2026-08-07-006 perf gate), DSPageHeader vertical padding tightened."

