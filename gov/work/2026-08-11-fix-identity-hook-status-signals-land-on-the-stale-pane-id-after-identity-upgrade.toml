#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-08-11-019"
title = "fix(identity): hook status signals land on the stale pane id after identity upgrade"
status = "done"
created = "2026-08-11"
started = "2026-08-11"
completed = "2026-08-11"
refs = [
    "RFC-0004",
    "RFC-0008",
]

[content]
description = """Found in the WI-2026-08-11-013 live smoke event trail (seq 10): after an identity upgrade (local-e4bd -> claude-0017af01), the UserPromptSubmit hook's explicit working signal landed on the STALE pane id local-e4bd instead of the bound durable identity. Root cause: the pane wrapper daemon forwards agent_status envelopes stamped with the registration id it captured at startup; it never learns about the rebind that its own forwarded agent_update triggered (the hub's register/agent_update response DOES return the bound agent_id — the daemon ignores it). Effects: (a) hook-driven presence lands on an id that is no longer registered — the merge path (AgentRegistry.applySignal) then RESURRECTS a phantom registry entry for the unregistered id (bounded but wrong; invisible in list_agents since listing iterates the routing table); (b) the durable identity misses its explicit channel — in the smoke only the passive channel carried the working edge for claude-0017af01, so hook precedence (explicit beats passive) is silently lost after every upgrade. Preferred fix locus: HUB-SIDE — handleAgentStatus should resolve the subject from the sending connection's CURRENT bound identity when the sender is a registered wrapper connection (payload "agent" override stays honored for anonymous/workbench one-shots, whose acceptance rules already bound what they can do); this is unforgeable and requires no daemon protocol change. Alternative (weaker): daemon updates its self-id from the agent_update response. Consider also: applySignal should not create entries for never-registered ids (phantom guard)."""
notes = ["Fixed hub-side as proposed: handleAgentStatus resolves subject from the sending connection's CURRENT bound identity for registered wrapper connections (anonymous one-shots keep the payload override); applyStatusSignal refuses signals for unregistered ids (phantom guard). Wire e2e: upgrade then agent_status with stale source -> status lands on the durable id, done state visible in list, stale pane id absent."]

[[content.acceptance_criteria]]
text = "agent_status from a registered wrapper connection is attributed to the connection's CURRENT bound identity (post-upgrade signals land on the durable id); anonymous one-shot agent override unchanged; registry test covers the upgrade-then-notify sequence"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "applySignal no longer resurrects phantom entries for never-registered ids"
status = "done"
category = "fixed"
