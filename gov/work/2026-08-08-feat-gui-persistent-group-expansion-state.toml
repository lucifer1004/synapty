Termius parity (groups round): group tree expansion state is per-view @State (all expanded by default) and resets every time the Hosts page is re-entered; deep trees become tedious.

Fix: persist collapsed groups in UserDefaults (AppStorage, JSON-encoded set of group IDs); expansion defaults to open and survives leaving/re-entering the Hosts page and app restarts."""

