status = "done"
category = "chore"

[[content.acceptance_criteria]]
text = "the dead tmux guard is gone, and a comment records why a guard there could never fire"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "the repaint assertion requires a row past the last one with content, rather than a copy of the holder's default height"
status = "done"
category = "chore"

[[content.acceptance_criteria]]
text = "the sessions column map names all ten fields, and the failure message names the column it actually read"
status = "done"
category = "chore"

[[content.acceptance_criteria]]
