status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "ADR amendment records hub lifecycle = app lifecycle (fixing the subprocess drift from ADR-0001's embedded-in-process deliverable), port as runtime detail, and the discovery file as the only external contract"
