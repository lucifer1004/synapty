#:schema ../schema/work.schema.json

[govctl]
id = "WI-2026-08-12-005"
title = "refactor(tools): move tool_request execution from the hub to the workbench (hub holds no secrets)"
status = "done"
created = "2026-08-12"
started = "2026-08-12"
completed = "2026-08-12"
refs = [
    "ADR-0008",
    "RFC-0003",
]

[content]
description = """
[[ADR-0008]] decision 6: the hub holds no secrets and no authority. Today the HUB loads the GitHub PAT from the macOS Keychain and calls the API itself (src/hub/handlers.zig handleTaskList/Claim/Update/Comment/Create -> github.loadToken, service "synapty.github"). That single fact is what makes the hub non-relocatable, independent of any process boundary: move it to a Linux server and there is no Keychain, no `security` CLI, and no token.

Move tool_request execution to the WORKBENCH, using the pattern already established twice — exec_request is forwarded to the workbench subscriber which replies on a one-shot exec_receipt, and wake works identically. The hub becomes a pure router for task tools as well, and the credential never leaves the machine the human authorized it on.

Honest consequence to surface rather than hide: with the credential at the workbench, task tools require the workbench to be reachable. A remote agent working overnight while the laptop is closed can message peers and queue mail, but cannot claim or comment on an issue; it must receive the same fast, honest "no workbench available" the exec path already returns. Queueing tool_requests for later execution is explicitly REJECTED — a "claim this task" that lands eight hours late is worse than a refusal, because the world has moved on. Operations with side effects must not be deferred.

A future escape hatch is noted but not built: a human deliberately provisioning a SEPARATE, scoped credential on a server for autonomous operation — the same shape as RFC-0007 exec arming (explicit human act, bounded authority, visible), never an automatic copy of the laptop's PAT."""
notes = ["""
IMPLEMENTED 2026-08-12. src/tools.zig (task tool execution + credential load, extracted whole from src/hub/handlers.zig), `synapty tools exec --tool X --args JSON` as the workbench-side executor, Sources/Services/ToolBridge.swift consuming forwarded tool_request frames and answering on tool_receipt, hub-side forwardToolRequest/handleToolReceipt + HubState.toolForward/routeToolResponse.

COVERAGE HONESTY on the third criterion: the e2e (src/e2e_test.zig) drives hub -> workbench -> agent with a STAND-IN workbench and does not call GitHub — a test suite that mutates the operator's real hub repo over the network would be worse than the coverage is worth. The GitHub leg was verified by a live smoke instead (`synapty tools exec --tool task.list` against the real repo, returned both issues). The "hub never reads the Keychain" half is covered STRUCTURALLY in src/hub.zig: the test reads the hub sources and fails if any of them imports the github module or calls loadToken, which is stronger than a behavioural assertion because it cannot be satisfied by a code path that merely happens not to run.

Not done: the escape hatch for autonomous server-side operation (a separately provisioned, scoped credential) is recorded in the description and deliberately not built."""]

[[content.acceptance_criteria]]
text = "tool_request is forwarded to the workbench and executed there (invoking the local synapty binary so the zig GitHub implementation is reused); the hub's routing path no longer loads credentials or calls the GitHub API"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "with no workbench connected, tool_request fails fast with a clear 'no workbench available' rather than hanging or queueing; deferred execution of side-effecting operations is rejected by design and the rejection is documented"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "e2e proves an agent's task tool call round-trips through hub -> workbench -> GitHub and back, and that the hub process itself never reads the Keychain"
status = "done"
category = "chore"
