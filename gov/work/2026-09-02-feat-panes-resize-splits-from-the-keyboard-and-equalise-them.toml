description = """
Dividers can only be dragged. The model has resizeSplit(splitID:ratio:)
already; what is missing is a keyboard route to it and an equalise verb
(tmux select-layout even-*). Register the chords in the one dispatch table
([[RFC-0016]] C-TABLE) — the old view-switch for chords was retired for a
reason."""

[[content.acceptance_criteria]]
text = "chords resize the focused pane's split by a fixed step in each direction, through the same resizeSplit path the divider drag uses"
status = "done"
