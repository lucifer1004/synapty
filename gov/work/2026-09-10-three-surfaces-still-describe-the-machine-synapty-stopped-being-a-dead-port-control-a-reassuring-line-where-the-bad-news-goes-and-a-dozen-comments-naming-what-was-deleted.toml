[govctl]
id = "WI-2026-09-10-003"
title = "Three surfaces still describe the machine Synapty stopped being: a dead port control, a reassuring line where the bad news goes, and a dozen comments naming what was deleted"
status = "done"
created = "2026-09-10"
started = "2026-09-10"
completed = "2026-09-10"
refs = [
    "ADR-0020",
    "RFC-0010:C-DIAGNOSABILITY",
]

[content]
description = """
Three shapes of the same defect: a description of the system that stopped
being true and nothing failed when it did.

A DEAD CONTROL WITH LIVE PROSE. Settings → Ports carried a "Tunnel port"
box whose help said "Applied on the next tunnel connection". Its value
reached `SynaptySettings.tunnelPort`, was copied into
`TunnelManager.tunnelPort` at launch and on every change — and was read
by nothing. Every tunnel port in the app comes from `peerPort(for:)`,
which allocates one per host from 9200, deliberately: the comment above
it says a single global port is only safe for a REVERSE forward, and the
reverse tunnel is gone. So the box was the last surviving organ of a
retired topology, and it told the human it worked. Removed rather than
wired up — wiring it up would contradict the per-host rule that replaced
it. The section keeps its help, corrected, because someone looking for a
port setting is exactly who needs to read that ports are automatic.

A REASSURING SENTENCE WHERE THE BAD NEWS GOES. `peerForward` answered
`hub_port.len == 0` — the case where no hub could be started on the far
host, so there is no peer link and no cross-machine A2A — by printing
"ControlMaster already established (reusing)." to stdout. A sentence
about a different subject, in the affirmative, at the exact point in the
setup transcript where the operator needed the warning to stand out.
`ensureHub` had already printed the real warning just above; this
followed it with a success line. Now it returns silently, and the
account step for "opening the link between the two hubs" is recorded
only when there is a link to open.

TWELVE COMMENTS AND TWO CLAUSES NAMING WHAT WAS DELETED. `connect.sh`
and `setup-host.sh` went in [[ADR-0020]]; tmux went in [[ADR-0012]]; the reverse
tunnel went in [[ADR-0008]]. What remained: user-visible `--help` text
explaining that `diag` exists "so `connect.sh` and `setup-host.sh` do not
carry a second implementation"; `SyncPreflight` justifying its whole
existence with "Synapty spawns arbitrary child processes, SSHes out and
drives tmux"; `HostReadiness` listing "a ControlMaster and a reverse
tunnel" among what the workbench holds; two comments explaining a
positional argument layout that no longer exists; and two references to
functions that do not — `paneWouldLoseAProcess` (never existed under
that name) and `unregisterAgent` (it is `teardownAgent`).

[[RFC-0003]] C-CLI-TOOLS said "Remote devices need no installation step: the
deployed binary speaks the same protocol over the reverse tunnel" — a
sentence that contradicts itself in its own clause and describes a
transport that was retired.

[[RFC-0011]] C-HEADLESS-GATE said, in the present tense, "`connect.sh`
launches `synapty run --hold --detach`". That clause carries a
requirement that an amendment "MUST RE-DERIVE THE INVENTORY AGAINST WHAT
IS THEN ON THE MACHINE", and observes that it "has now been wrong twice
in the same way". It was wrong a third time, in the same way, and now
says so.

Found by the drift-hunter and clause-auditor passes of the 2026-09-10
debt sweep."""

