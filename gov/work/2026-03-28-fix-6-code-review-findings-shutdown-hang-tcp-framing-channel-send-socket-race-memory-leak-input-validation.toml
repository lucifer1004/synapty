[content]
description = "Fix 6 code review findings across src/run.zig, src/hub.zig, src/mcp.zig, src/protocol.zig. Findings: (1) shutdown hang — blocking I/O not interrupted before thread join, (2) broken TCP framing — no line-buffering across read() boundaries, (3) silent channel send failure — send path always emits dm, (4) hub socket data race — concurrent readers on same stream, (5) unbounded memory growth — page_allocator + alloc_always never freed, (6) crash on malformed input — unchecked json.Value union access. All are bug fixes against existing RFC-0002 specified behavior."

