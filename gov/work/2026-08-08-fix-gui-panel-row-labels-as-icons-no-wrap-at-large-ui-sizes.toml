[content]
description = """
Bug report: with a large UI Size, the Terminal panel's text labels (Opacity, Cursor, ...) wrap because the fixed 52pt label column is too narrow at scaled font sizes.

Fix: replace the text labels with fixed-width SF Symbol icons (sun.max / moon / textformat / textformat.size / opacity / cursorarrow) that do not scale with the UI font; each icon keeps a tooltip + accessibility label. Row height stays uniform at any UI size."""

