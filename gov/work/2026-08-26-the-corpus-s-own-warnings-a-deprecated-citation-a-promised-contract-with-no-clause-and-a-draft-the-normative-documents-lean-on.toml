[[content.acceptance_criteria]]
text = "RFC-0006's title, summary and non-goals no longer promise managed start, which was deliberately removed"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "`just gov-lint` reports zero, and reports it because there is nothing left rather than because the checks were loosened — the one check that lost a case lost it to a real distinction (a past-tense record is not a promise), and deprecated clauses are skipped because they are history and are not edited"
status = "done"
category = "chore"

