[govctl]
id = "WI-2026-03-31-006"
title = "Fix keyboard input passthrough — Ctrl in Zellij, tab switching, Cmd+F search"
status = "done"
created = "2026-03-31"
started = "2026-08-05"
completed = "2026-08-05"

[content]
description = "Three keyboard/input issues: (1) Ctrl keybindings are intercepted by the app when running Zellij inside a pane — Ctrl sequences must pass through to the inner terminal multiplexer. (2) Cmd+Shift+[ / ] for tab switching does not work when terminal pane is focused — key event not reaching the app responder chain. (3) No Cmd+F find-in-scrollback feature."

[[content.acceptance_criteria]]
text = "Ctrl keybindings pass through to programs inside terminal panes (e.g. Zellij)"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "Cmd+Shift+[ / ] switches tabs even when terminal is focused"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "Cmd+F find-in-scrollback"
status = "done"
category = "added"
