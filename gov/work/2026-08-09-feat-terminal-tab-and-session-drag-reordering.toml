[govctl]
id = "WI-2026-08-09-018"
title = "feat(terminal): tab and session drag reordering"
status = "done"
created = "2026-08-09"
started = "2026-08-09"
completed = "2026-08-09"

[content]
description = """
Sessions and tabs could be created and closed but not reordered, so their order was the order they happened to be opened in rather than the order the human wanted.

Sessions reorder through `List`'s `onMove`; tabs through `draggable`/`dropDestination` over an exported `dev.synapty.tab-drag` UTType, with a trailing zone so a tab can be appended at the end rather than only inserted between two others.

Landed in one batch with [[WI-2026-08-09-017]], [[WI-2026-08-09-019]] and [[WI-2026-08-09-020]]. The drag itself was left for the operator to try by hand — a pointer gesture is not something the suite can claim to have verified."""

[[content.acceptance_criteria]]
text = "sidebar sessions reorder via List onMove; tabs reorder via draggable/dropDestination with a dedicated UTType (WI-2026-08-08-076 gesture-crash class avoided: no gesture composition on top of draggable)"
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "manager moveSession/movePane reorder tests incl. bounds; suite green; interactive drag left for user confirmation"
status = "done"
category = "chore"
