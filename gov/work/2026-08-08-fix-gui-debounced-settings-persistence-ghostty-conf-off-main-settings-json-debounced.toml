[content]
description = "Audit item #3: every @Published didSet synchronously writes settings.json AND rewrites ghostty.conf AND posts notifications on the main thread — a slider drag fires disk IO per tick. Fix: ghostty.conf rewrite moves to a background queue (it feeds ghostty's config reload, so the notification that triggers the reload stays immediate — ordering preserved); settings.json persistence is debounced (~500ms) so bursts coalesce. applyAppearance stays immediate (UI crossfade)."

