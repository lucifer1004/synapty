id = "WI-2026-08-09-017"
title = "feat(terminal): shell-driven tab titles — SET_TITLE action wired to focused-leaf tab labels; manual rename wins"
status = "done"
created = "2026-08-09"
started = "2026-08-09"
completed = "2026-08-09"

[content]
description = """
A tab labelled by its index tells the human nothing about what is in it. Shells and TUIs already announce what they are doing through the terminal's SET_TITLE, and Synapty was discarding it.

SET_TITLE now routes through the leaf registry to the focused leaf's tab label. A MANUAL RENAME WINS: a title the human typed is a decision, and a shell that repaints its title every prompt must not overwrite it.

Verified live — zsh titles populate the tabs.

Landed in one batch with [[WI-2026-08-09-018]], [[WI-2026-08-09-019]] and [[WI-2026-08-09-020]]."""

[[content.acceptance_criteria]]
text = "GHOSTTY_ACTION_SET_TITLE handled — surface resolved to leafID via registry, title flows to TerminalPaneManager.leafTitles; tab shows the FOCUSED leaf's shell title unless the user renamed the tab (rename wins permanently); titles capped and cleaned up on leaf close"
status = "done"
category = "added"

