[content]
description = "Approved 2026-08-09. Feasible because SplitContentView renders surfaces in a FLAT ForEach keyed by leaf UUID — the split tree only computes frames, so rebuilding the tree with the same LeafData values preserves SwiftUI identity and never deinits a ghostty surface (the PTY-killing removal class is structurally avoided). Presets are pure tree folds over the active pane's existing leaves (rearrange-only V1; menu disabled below 2 panes): Columns (equal-width nested h-splits), Rows (vertical), Grid (rows of two, odd leaf gets a full-width last row), Main+Stack (first leaf 0.65 main, rest stacked trailing)."

