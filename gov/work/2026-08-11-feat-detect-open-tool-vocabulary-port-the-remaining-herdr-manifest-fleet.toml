[content]
description = "We bundle 3 manifests keyed to a closed tool identity; herdr ships 19 (amp, antigravity, cline, cursor, devin, droid, github-copilot, grok, hermes, kilo, kimi, kiro, maki, opencode, pi, qodercli on top of claude/codex/gemini). Two moves: (1) open the tool vocabulary end-to-end — registration already carries tool as a free string on the wire; the Swift layer's closed enum must accept arbitrary tools and degrade gracefully (no manifest -> no passive signals, explicit notify still works); (2) make DetectManifestLoader discover every *.json in the bundle detect/ dir plus the override dir (override beats bundle per tool) instead of iterating a hardcoded list, then port the remaining herdr manifests with the established state mapping (blocked->waiting, idle->done, unknown+skip_state_update->skip) and Apache-2.0 attribution headers. Out of scope: OSC 9;4 progress channel (needs libghostty plumbing investigation, tracked separately when justified). Origin: herdr gap analysis 2026-08-11 (tier 'cheap and high-value')."

