status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "the duplicated unset/REMOTE_LAUNCH pair and the truncated eval justification are gone"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "fail() has one shape in all seven suites — $* so a message is not truncated, stderr so it is not interleaved with the ok lines"
status = "done"
category = "changed"

[[content.acceptance_criteria]]
