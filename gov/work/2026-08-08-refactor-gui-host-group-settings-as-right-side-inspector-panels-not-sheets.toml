[content]
description = """
Product feedback: Group Settings and Host settings must not be modal sheets — a right-side panel (inspector) fits the workbench flow much better.

Fix: AddHostSheet and GroupEditSheet become inspector panels (SwiftUI .inspector on the Hosts page): host editor (new/edit) and group settings render in a right-side panel with a header + Save; sheet presentation is removed for these two; New Group and Identity sheets stay as-is (lightweight creation forms). Naming follows the panel form: AddHostSheet → HostEditorPanel, GroupEditSheet → GroupEditorPanel."""

