[content]
description = """Termius-style OS recognition on host cards (user request, follows WI-2026-08-08-090 Termius-parity pass). HostEntry gains an optional osHint string (lowercase id: "macos", "windows", "linux", or a distro id like "ubuntu"/"debian" from /etc/os-release ID=). Three sources, in priority order: (1) user picks the OS in the host editor (DSDropdown; "Auto" default), (2) auto-detect after a successful tunnel connect or Test Connection — `uname -s` plus `grep ^ID= /etc/os-release` over BatchMode ssh, written back to the store only when osHint is empty/auto so a manual pick is never overwritten, (3) unknown. Card avatar: KEEPS the deterministic per-host tint; when the OS is known the initials are replaced by a white OS glyph (SF Symbols where honest: apple.logo for macOS; otherwise neutral geometric marks bundled as template assets — NO trademarked distro logos, that is Termius's licensing burden, not ours). Unknown OS keeps initials. Detection failures stay silent (happy-path V1)."""

