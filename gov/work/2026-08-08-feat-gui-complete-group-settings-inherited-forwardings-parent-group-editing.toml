description = """
Termius parity (groups round): the group settings sheet is incomplete — HostGroup supports inherited forwardings and a parent, but GroupEditSheet can neither edit port-forwarding rules nor change the parent group (reparenting requires delete + recreate).

Fix: GroupEditSheet gains a parent-group picker (Top level + all groups except itself and its descendants — cycle-safe) and an editable inherited-forwardings list (shared ForwardingsEditor component, same UX as AddHostSheet). Saving persists via HostStore."""

