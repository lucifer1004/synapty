description = "Implement full split tree for terminal panes within tabs. Each tab can be split horizontally/vertically into a binary tree of ghostty surfaces. Host app manages the split tree (NSSplitView layout), surface creation, focus routing, and resize. Cmd+D splits right, Cmd+Shift+D splits down. Handle GHOSTTY_ACTION_NEW_SPLIT in action callback."

notes = [
    "SwiftUI SplitContentView uses GeometryReader for equal splits (no resize handles V1). Surface identity preservation across tree changes needs testing â if surfaces are recreated on split, may need a flat ZStack approach with manual frame positioning.",
    "SwiftUI destroys NSViews when parent view structure changes (leafâsplit). Must use flat ZStack with ForEach(leaves) + computed frame positions instead of recursive view tree. Same pattern as tab-switching surface preservation.",
    "2026-03-27 (gui): Implemented SplitTree (binary tree), SplitContentView (recursive SwiftUI renderer), split management in TerminalPaneManager, keyboard shortcuts (Cmd+D split right, Cmd+Shift+D split down, Cmd+W close, Cmd+]/[ navigate). Wired via GhosttyApp callbacks. Build and govctl check pass.",
    "2026-03-27 (gui): Fixed split implementation: NotificationCenter for split commands (solved callback timing), lowercased() for Cmd+Shift shortcuts, per-surface userdata for robust close detection, ZStack+computed frames for surface preservation across tree changes. All split operations working.",
]
