[content]
description = "RFC-0005 implementation over the WI-2026-08-11-012 substrate. Hub: wake candidates on the identity-keyed mailbox's empty->non-empty edge (including the registration/re-home-with-mail fresh-edge rule), cancellation on self-read/unregister/generation-change, wake receipt events (delivered/stalled/cancelled, generation-carrying) under the C-EVENT-LOG extensibility rule. GUI: per-pane arming (default OFF, visible affordance, persists with session snapshot per C-AUTHORITY as finalized), state gate (idle/done only, fresh re-sample, foreground-process check, ~3s human-typing backoff, waiting ABSOLUTELY prohibited), injection via ghostty_surface_text + separately-sent Enter after ~300ms (bracketed-paste aware, no focus theft), fixed template zero interpolation, closed-loop ack (working edge within 5s else wake-stalled, one retry after gate reopens, then badge the human). Depends on WI-2026-08-11-012 (mailbox location + identity)."
notes = [
    "Scope decisions: (1) tools WITHOUT a detection manifest cannot be woken in V1 — the gate requires a fresh manifest-backed classification and closes on nil (C-STATE-GATE cannot-see-clearly); covered tools = the 19 shipped manifests. (2) cli-tmp targets never mint candidates (C-MAILBOX carve-out keeps them on the push path; they host no panes). (3) C-INJECTION-MECHANICS bracketed-paste wrap is a SHOULD and is not implemented: ghostty_surface_text submits through the surface's live input encoding, satisfying the MUST; the template is single-line plain ASCII. (4) Armed-bit snapshot persistence rides WI-014's session snapshot — no snapshot exists yet, the bit lives in pane state. (5) Ack accepts ANY observed status change inside the window (RFC: working edge or any lifecycle change). (6) Hub keeps a stalled candidate outstanding — retry/badge discipline is workbench-side; mailbox drain or generation end cleans up.",
    "Live-smoke finding #1 (2026-08-11): SPEC-LEVEL CONFLICT between RFC-0004 C-PRECEDENCE and RFC-0005 C-STATE-GATE as originally finalized. A freshly registered at-rest claude never leaves merged=unknown (passive done rejected — rule 4 requires working/waiting prior; passive idle always inert), so the original gate (merged must be idle|done) could NEVER open for the fresh-edge scenario — wake exists to create the first turn but demanded evidence only a previous turn could produce. Event-trail proof: identity upgrade + wake_candidate all correct, zero agent_status_changed (every passive done silently rejected), 30s+ of unknown while claude sat at rest with title '✳ Claude Code'. Fix: C-STATE-GATE amended (folded into the 0.1.0 spec-phase candidate) — merged demoted to veto channel (working/waiting), fresh sample stays the mandatory positive evidence. C-PRECEDENCE untouched (attention semantics intact — the status bar honestly shows unknown until the first turn).",
    "Live smoke PASSED (2026-08-11 ~18:40): claude-0017af01 (SessionStart hook, durable identity) at rest in an armed pane; dm queued {queued,hosted} -> wake_candidate(gen=3) -> amended gate opened (fresh sample done, merged unknown passes veto) -> template injected + Enter -> working edge on BOTH channels within 3s (explicit UserPromptSubmit hook + passive title spinner) -> wake_delivered(gen=3) on the event log -> woken claude drained the mailbox via synapty recv and acknowledged in-pane. Disarmed-silent proven in the earlier phase (candidate stayed pending, zero receipts). Screenshot + full event trail in session records. RESIDUAL FINDING (filed separately): seq-10 shows the UserPromptSubmit explicit working landed on the STALE pane id local-e4bd — the wrapper daemon stamps forwarded agent_status with its startup registration id, not the bound identity; harmless here (passive channel carried the durable id) but it resurrects phantom registry entries.",
]

