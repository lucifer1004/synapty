[content]
description = "Clean build currently emits 24 warnings, all from project code — none acceptable. (1) MainActor isolation violations: Timer/closure bodies call @MainActor methods from Sendable closures — HubManager.swift health-check timers (12 sites: isPortInUse/appendLog/restartHub/status/port), TunnelManager.swift heartbeat timer (runHeartbeat/checkTunnel), AgentMonitor.swift poll timer (refresh) — these become hard ERRORS in Swift 6 language mode and are latent data races. (2) TerminalPaneManager.swift:5 conformance of TerminalPaneManager to TerminalCoordinator crosses main-actor isolation (Swift 6 error). (3) Deprecated onChange(of:perform:) on macOS 14 (ContentView 206/210, ActivityLogView 73, HubStatusView 124). (4) Dead code: HostModel.swift:496 var->let, HostConfigSheet.swift:645 unused parent, ContentView.swift:147/164 unused withCString results. (5) project.yml run-script phase 'Bundle deploy and hub binaries' runs every build (no outputs declared)."

notes = [
    "2026-08-08: Clean build now emits ZERO compiler warnings (was 24). MainActor isolation: TerminalCoordinator protocol is now @MainActor with nonisolated(unsafe) ref holder and Task { @MainActor } hops at all 13 call sites; HubManager health-check timers, TunnelManager heartbeat timer, and AgentMonitor poll timer wrap their bodies in Task { @MainActor }; the blocking ssh -O check was extracted into nonisolated static sshControlCheck with everything resolved on the main actor first. Deprecated single-param onChange replaced at 4 sites. Dead code: var->let (HostModel), unused parent binding removed (HostConfigSheet), unused withCString results marked (ContentView). Run-script phase 'Bundle deploy and hub binaries' now disables dependency analysis in project.yml. Verified: clean xcodebuild 0 warnings, 94/94 Swift + 128/128 Zig tests green.",
]
