THE THIRTEENTH REVIEW: 24 CLAIMED, 24 REFUTED, NONE SURVIVED. This is the criterion, and it is worth stating exactly what it means and what it does not.

THE SHAPE OF THE CHECK. Four reviewers on distinct lenses — contradiction, conformance, implementability, reachability — then TWO independent refuters per claim, one reading only the corpus and one only the code, each instructed to default to REFUTED and to quote the line or the clause text that decides it. A claim survived only if NEITHER could refute it. Across the last five rounds that discipline produced: 21→3, 16→2, 21→1, 21→2, 24→0.

WHAT "NO CRITICAL" DOES NOT MEAN. It does not mean nobody claimed one — twenty-four people-hours of reading claimed twenty-four. It does not mean the document is finished; thirty-four majors were recorded this round and are not addressed. It means that every claim which asserted an internal contradiction, a cross-clause contradiction, an unimplementable obligation, or a demonstrable violation of clause text failed under adversarial verification by two readers who wanted it to fail.

THE ROUNDS THAT EARNED IT. Nine through twelve found seven real defects, every one on the path a real agent takes: a peer claiming this hub's own id was admitted; an advertised qualifier was never checked against the sender; a derivation could contain the qualifier separator; a wait on a remote identity could never be satisfied; an identity upgrade told no peer, and its displacement sibling did not either; a relayed frame was re-forwarded a second hop while the sender was told it was refused; and a held copy was released by the attempt rather than by the acknowledgement. Four of the seven were the same shape — a rule discharged at one site and unhonoured at its sibling — which is why the eleventh round's lesson became the twelfth's lens and the twelfth's became the thirteenth's.

AND ONE MORE CAME OUT OF A REFUSAL. A refuter's aside named `identity_rejected` as "a real but pre-existing RFC-0008 conformance item": the kind is named in C-IDENTITY and was appended nowhere. I had left that half a day earlier believing the kind would need naming first — it was already named, in the clause I had not read. It is implemented now, driven through `handleAgentUpdate` rather than by calling the recorder, because the first test I wrote for it asserted the function and not the path, and a mutation deleting the call site left it green.

WHAT GUARDS IT NOW. `just verify` runs the Zig suite, the Swift suite, `govctl check`, `gov-lint`, `unshipped` at zero, and a two-hub federation e2e over a real relay link — the last because every unit test in that area builds its directory with the one function these paths do not call, so two hubs is the only arrangement in which the production path is the path under test. It reproduced the tenth review's defect against the pre-fix binary before confirming the fix.""",
]

