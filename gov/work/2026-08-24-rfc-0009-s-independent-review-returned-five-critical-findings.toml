[content]
description = """
An independent review of RFC-0009 (govctl rfc-reviewer, run because the only prior review was the author's own) returned MAJOR ISSUES: 5 critical, 12 major, 7 minor. The full report is in this item's notes. Two checks came out clean — no compatibility language remains, and the submission-boundary impersonation honesty is maintained — and the rest is work.

THE CRITICAL FIVE.

1. C-BOUNDARIES claims a relay link is AUTHENTICATED AS A PEER, and its own argument dissolves that: relay traffic arrives on the same loopback listener as every submission, and the only discriminator the clause allows is the first frame. So any local process may send relay_hello, become a peer, and speak for every identity it claims — with none of the one-identity-per-connection limit submission carries. The honesty this RFC keeps for submission is abandoned at the boundary with the LARGER blast radius, and the overclaim is load-bearing elsewhere: RFC-0011 C-DELEGATION rests its security argument on 'workbench-trust plus link authentication'.

2. C-BOUNDARIES says there are EXACTLY TWO kinds of peer-facing connection, and two accepted normative RFCs already falsify it: RFC-0012 C-LEVEL-CONTROL requires an anonymous one-shot connection carrying hub_info that 'registers nothing and holds no identity', and RFC-0010 C-DIAGNOSABILITY puts capability sets on the same surface. Under C-BOUNDARIES a connection whose first frame is not relay_hello MUST be a submission connection, which carries exactly one identity — which that connection does not.

3. C-DELIVERY's answer set is miscounted and unreconciled. The clause header says FOUR over a five-item list and the wire-shape bullet says six; and RFC-0008 C-MAILBOX — which this clause amends, and which carries the RFC-0003 C-CLI-TOOLS exit-code mapping — still enumerates five names. No accepted clause says whether conflicted is exit 0 or non-zero, so the implementation guessed. THIS ONE IS OURS, made an hour before the review when conflicted was added.

4. C-DELIVERY has no answer for a forward that is in flight or negatively acknowledged. It mandates per-message acks and explicit NACKs, and then requires the sender receive one of six values, none of which covers 'transmitted, not yet acked' (forwarded overstates, spooled means the peer is unreachable and it is not) or 'the peer refused'. Nor does it say whether send blocks for the ack, or for how long. Two conforming implementations differ on the commonest cross-machine send, and one reports success for a message the peer rejected.

5. C-WORKBENCH-ROUTING routes on facts the protocol does not carry. It says a hub MAY relay a task-tool request to a peer WHOSE WORKBENCH HOLDS THE CREDENTIAL and MUST fail fast when no reachable peer has a workbench — and C-DIRECTORY's METADATA SCOPE closes advertisements to identity, hosting peer and reachability, while relay_hello carries peer id, version and capabilities. The hub cannot evaluate either predicate. It compounds with RFC-0003 C-HUB-REPO, amended BY this clause to require the relaying party include its hub-repo identity, where that party is a hub with no workbench and therefore no hub-repo configuration at all.

The twelve major findings and seven minor are in the notes verbatim."""
notes = [
    """
FULL REPORT, verbatim from the independent review (govctl rfc-reviewer, 2026-08-24). Severities are the reviewer's.

MAJOR (12):
1. C-WORKBENCH-ROUTING — a MAY cannot deliver a guarantee the same clause says MUST survive: it states federation MUST NOT revoke RFC-0003 C-EVENTS' guarantee that an agent on any device may use task tools, then makes the only mechanism optional. Also uses 'a peer whose workbench holds the credential' and 'no reachable peer has a workbench' as one predicate; they are two, and a peer with a workbench that never ran github login satisfies the second and not the first.
2. C-PRESENCE — stale against RFC-0010 C-DIAGNOSABILITY, which asserts 'RFC-0009 C-PRESENCE is amended in the same change' and requires unknown_cause (no_evidence / peer_unreachable / peer_lacks_capability) on list_agents and the C-SUBSCRIPTION snapshot. C-PRESENCE carries no such field. RFC-0011 C-DEFAULT and C-VISIBILITY add a pending-wake flag and a delegation mark to the same carrier, likewise unrecorded.
3. C-PRESENCE — the synapty wait qualifier covers two remote failure modes and leaves two: a target hosted by a reachable peer that did not declare the presence capability (status permanently unknown, so wait blocks to timeout and exits 3, indistinguishable from a slow agent), and a conflicted target (send has a first-class answer, wait has nothing). Both are silent-hang shapes.
4. C-DIRECTORY / C-DELIVERY — 'every peer is currently reachable' never defines the peer set, and that quantifier decides unknown vs indeterminate. Live-linked peers? Live-or-tombstoned? Expired? Hosts configured but never handshaken? Two hubs give opposite answers to the same send.
5. C-DIRECTORY — the per-peer cap makes a hub report a known truncation as a typo: a capped-out identity matches no entry, so with the peer reachable C-DELIVERY forces unknown. The hub holds the evidence for indeterminate. This is the failure the cap is cited to prevent.
6. C-DIRECTORY / C-DELIVERY — the spool is keyed per peer, directory entries now MOVE between peers, and the interaction is undefined: messages already spooled toward a departed peer, a tombstone expiring with spooled mail under TTL, and RFC-0010 C-PEER-IDENTITY's 'expire everything keyed on the old id'.
7. C-EVENT-LOCALITY — mandates new event kinds, requires them distinct from local lifecycle kinds, hangs synapty wait on a remote identity off them, and names none. Same for the relay frame vocabulary: only relay_hello is named; advertisement, incremental update, forward, ack and NACK are not — in a protocol RFC-0010 C-CAPABILITIES says will be spoken between differing builds.
8. C-BOUNDARIES / C-IDENTITY-SCOPE — RFC-0008 C-IDENTITY resolves an envelope's effective source from the connection binding; a relay link carries many identities and has no binding, so the rule cannot be evaluated there and nothing says what replaces it.
9. C-IDENTITY-SCOPE — '@ is RESERVED and MUST NOT appear in any locally derived identity' has no enforcement rule, while RFC-0008's derivation validates only printable/no-whitespace/bounded, which @ passes. RFC-0008 states the analogous local- rule concretely; this one states a prohibition with no mechanism.
10. C-WAKE-LOCALITY — 'not authorised until RFC-0011's evidence requirements are met' is a condition about the world; RFC-0011 C-HEADLESS-GATE requires an AMENDMENT to that clause. A team believing it solved the problems can ship injection under RFC-0009's wording and violate RFC-0011's.
11. C-BOUNDARIES — the handshake still says relay_hello carries 'its protocol version'; RFC-0010 C-CAPABILITIES replaced the single number with a supported RANGE and calls the single integer the defect it exists to fix. The implementation already requires protocol_min/protocol_max.
12. RFC-0009 metadata — still version 0.1.0 with one changelog entry 'Initial draft', while the clauses carry post-finalization behaviour changes; refs omit RFC-0010, RFC-0011 and RFC-0015 though all three are cited normatively, and most citations are plain text rather than link syntax, so check's reference analysis does not see the dependency.

MINOR (7):
- C-DIRECTORY — two enumerations of an advertisement disagree within one clause (identity+peer vs identity+peer+reachability, NOTHING ELSE); and reachability is the receiver's derived fact about its own link, so putting it on the wire invites a field whose sender always writes 'reachable'.
- C-DIRECTORY — spool bounds get stated defaults; the directory cap, enforced by the same argument and with sharper consequences, gets none.
- C-IDENTITY-SCOPE — the strip rationale cites the wrong direction: the rule it invokes is about the ORIGIN, the strip is about the TARGET. An implementer following it literally strips the wrong field.
- C-IDENTITY-SCOPE — no rule for a relayed frame whose target qualifier names a THIRD peer; non-transitivity forbids forwarding, so it must be refused, and the clause does not say so.
- C-DELIVERY — the spool-drop record goes on RFC-0004 C-EVENT-LOG's bounded in-memory ring, which does not survive a restart, while the spool is durable: the record can vanish while the thing it records persists.
- C-PRESENCE — 'a consumer that ignores both degrades to the single-hub reading' is stated as a property of the carrier, and RFC-0011 C-DEFAULT says the opposite for a field riding it.
- Unqualified cross-RFC clause references: C-MAILBOX, C-PRIMITIVES, C-PRECEDENCE are cited as if they were RFC-0009's own.

NOT ASSESSED by the reviewer: whether RFC-0013 or RFC-0016 add cross-hub obligations; whether the hub_info / anonymous-connection surface has an owning clause anywhere (RFC-0010 and RFC-0012 both write to it).""",
    "IMPLEMENTATION DRIFT FOUND WHILE FIXING THE CRITICALS, recorded rather than fixed here: C-DELIVERY has required per-message relay acks and explicit NACKs since v0.1.0 and there are none — grep finds no ack frame at all, and a forward is answered on the WRITE succeeding. So `forwarded` currently claims what the clause says it must not, and `refused` has nothing that can produce it. The enum carries the value because it is the wire contract; the ack path is its own work.",
    "CORRECTION to the drift note above: the relay frames DO exist and are received — relay_hello, relay_advertise, relay_forward, relay_presence, relay_ack, relay_nack, relay_refused. My grep was for the wrong name. What is missing is the BEHAVIOUR C-DELIVERY hangs on them: nothing holds the forwarded copy, so a relay_ack releases nothing and a relay_nack only logs a warning, and the sender was answered on the write long before either arrives. So `forwarded` still reports a write rather than an acknowledgement, and `refused` has no producer — but the wire vocabulary is there, which makes the missing half smaller than the note claimed.",
    """
ALL FIVE CRITICAL, TWELVE MAJOR AND SEVEN MINOR ADDRESSED, except the document's own version bump, which is lifecycle-owned and left for authorization: refs now name RFC-0010/0011/0012/0013/0015, and 9 of the 10 clauses had bare RFC mentions converted to link syntax so the reference analysis can see the dependencies, but rfc.toml still says 0.1.0 with one changelog entry.

Two findings were already answered by the critical pass and needed nothing further: the MAY-versus-MUST in C-WORKBENCH-ROUTING and its two-predicates-as-one.

One is recorded rather than fixed and is its own work: C-DELIVERY's forward acknowledgement. The frames exist and arrive; what does not exist is holding the copy, correlating the ack, and answering the sender on it, so `forwarded` reports a write and `refused` has no producer.""",
    """
SECOND INDEPENDENT REVIEW, 2026-08-25: MAJOR ISSUES again — 6 critical, 15 major, 7 minor. Every one is addressed and recorded in RFC-0009's open 0.2.0 candidate, with companion amendments to RFC-0004 (C-WAIT, C-SUBSCRIPTION, patch bump), RFC-0010 (C-CAPABILITIES, C-DIAGNOSABILITY, patch bump), RFC-0008 C-IDENTITY and RFC-0003 C-HUB-REPO.

THREE OF THE SIX CRITICALS WERE INTRODUCED BY THE FIRST FIX PASS, which is the finding worth keeping. (a) The C-MAILBOX amendment TRUNCATED THE CLAUSE MID-WORD — 'carried in the machine-readab' — because the edit sliced on a substring and dropped the rest of the line; the sentence that says where the status names are machine-readably carried was gone, and the next paragraph ran on from the fragment. (b) C-DELIVERY said SEVEN answers in its header and six in the wire-shape bullet, one bullet below the paragraph that legislates against exactly that: the same defect the first review raised, reproduced by its own fix. (c) C-WORKBENCH-ROUTING gained a new bullet and kept the stale one, so the same state had two mandated answers and 'best-effort' contradicted the MUST two bullets up.

The other three: METADATA SCOPE still said an ADVERTISEMENT carries reachability while the new bullet said it does not; the relay trigger was split for the CAPABILITY but not for the OBLIGATION, so a hub whose workbench held no credential never relayed and RFC-0003 C-EVENTS' guarantee failed in the case the clause had just identified; and C-PRESENCE imposed two new wait behaviours that RFC-0004 C-WAIT — the clause that OWNS the exit codes — did not carry.

The criterion 'a second independent review returns no critical finding' is NOT met: the second returned six. It stays pending until a review comes back clean.""",
    """
THIRD INDEPENDENT REVIEW, 2026-08-25: 4 critical, 5 major, 11 minor — and the first critical is edit damage AGAIN, worse than last time: the peer-claims-what-we-host bullet appears THREE times in C-DIRECTORY and a sentence twice. The cause is my method, not my reading: when an edit script asserted on its SECOND anchor and died, I re-fetched the clause and re-ran with corrected anchors — re-applying the FIRST replacement, which had already landed. Twice.

WHAT I ADDED BEFORE THIS REVIEW was a mechanical sweep for truncation and count mismatches, the two shapes the second review caught. It reported zero, and it was blind to duplication because I had only encoded the failures I already knew about. The sweep now checks for repeated sentences too, and finds none anywhere in gov/.

The other three criticals: C-PRESENCE published a CLOSED three-value unknown_cause and mandated a fourth four bullets later; the three-kind taxonomy had no slot for the GUI's persistent subscribe or the CLI's direct queries, which RFC-0004 C-SUBSCRIPTION and RFC-0003 C-CLI-TOOLS both require and neither registers an identity for; and RFC-0008 C-IDENTITY still did not carry the submission-scoping C-BOUNDARIES asserts of it, though every other displacement in this set was landed in its owning clause.""",
    """
FOURTH INDEPENDENT REVIEW, 2026-08-25: 3 critical, and ALL THREE NEW — all in C-BOUNDARIES, the clause the third pass had rewritten. The rest of the document came back clean: the reviewer verified the seven delivery answers against C-MAILBOX's enumeration and its exit-code split, unknown_cause's four values across three RFCs, the wait exit codes, the two-condition gate in all four places, the capability names, the @ rule in both clauses, and reported no duplicated or truncated passage anywhere.

THE THREE WERE ONE FAILURE: a rename applied in the body and not in the sentence that enumerates. (a) The opening still said the kinds were SUBMISSION, RELAY and ANONYMOUS QUERY while the body defined OBSERVER — so the only sentence that ENUMERATES named a kind the clause did not define, and RFC-0012's brand-new citation of 'the OBSERVER kind' landed on a list without one. (b) 'THE OBSERVER SET IS ENUMERATED' ended with a description rather than a name ('the RFC-0003 C-CLI-TOOLS task queries'), in the sentence arguing that an unnamed set cannot classify — and four of those five frames MUTATE the task centre, so 'queries' was wrong twice. (c) The set overlapped submission's own vocabulary: in a pane, task, agents and wait reach the hub through the pane daemon's REGISTERED connection, so 'frame types are the discriminator and every other vocabulary is refused' made an implementation refuse list_agents from a pane.

METHOD CHANGED, WHICH IS THE POINT. C-BOUNDARIES' kinds section was rewritten WHOLE rather than patched — the third pass's own diagnosis, finally applied to itself. The kind is now decided by the OPENING frame, the observer vocabulary is named frame by frame, and it is explicitly NOT exclusive: what is exclusive runs the other way, with the relay vocabulary refused to everything but a relay link and register/send/recv refused to an observer.""",
    """
FIFTH INDEPENDENT REVIEW, 2026-08-25: 4 critical, all NEW — and the cause CHANGED, which is the result the pass was run for. The old failure mode is gone: the reviewer found no instance of a rename applied in a body and not in the sentence that enumerates, and verified every count and enumeration in the document agrees with itself and with the clauses that own the values. Whole-clause rewriting worked.

THE NEW CAUSE: I wrote closed enumerations from the RFC corpus alone and never checked them against the shipped hub. C-BOUNDARIES named seven observer frames; src/hub/session.zig serves ten anonymously. The four it omitted — agent_status, wake_report, exec_receipt, peer_connect — are each required by an accepted clause to come from a party holding no agent identity, and peer_connect is RFC-0009's own subject: it is how a relay link comes to exist, and it appeared in no RFC at all. Under the clause's residual rule each became a SUBMISSION connection carrying zero identities, which is the defect the OBSERVER kind was added to remove.

AND ONE WAS MY OWN REGRESSION, WORTH RECORDING PLAINLY: I deleted relay_refused last round because the fourth review said nothing defined it. RFC-0010 C-COLLISION requires a refusal frame the dialing side recognises, C-CAPABILITIES requires the two version ranges in its payload, the hub sends it in two places and peer.zig recognises it — and THIS WORK ITEM ALREADY CONTAINED MY OWN CORRECTION of exactly that mistake, written two rounds earlier. I took a reviewer's premise over a fact I had already checked and recorded. Restored, with its owner named.

Fixed with them: the residual rule now REFUSES rather than falling back to submission (which the hub already does); tool_receipt is the workbench's ANSWER carrying a result, not an acknowledgement, and it can deliver a result to an agent that asked — an unidentified write the clause had not counted; tool_response is out of a set that classifies by OPENING frame, since it is never a client's; who DIALS a relay link is stated (a workbench, with peer_connect, naming a peer the human configured); the two senses of 'anonymous' in this corpus are told apart; and the writes are bounded one by one rather than only the level change.

METHOD, THIRD REVISION: whole-clause rewrite, then read it end to end myself, then reconcile every named frame against src/hub in BOTH directions. The last step is new and it is what this review's finding demands; the reading step caught five frame names I had invented before the reviewer saw them.""",
    "MY OWN BOTH-DIRECTION CHECK BEFORE THE SIXTH REVIEW, on event kinds this time rather than frames, found two things. (a) The clause called the TTL drop `spool_dropped` and the hub mints `spool_expired` — a rename invented by the RFC, which would have made two spellings of one event a defect nobody owns. Corrected to the name that exists. (b) Three kinds the clause now requires do not exist in events.zig: directory_capped, directory_conflicted, peer_capabilities_changed. That is spec ahead of code rather than a defect in either — the clauses that require them (C-DIRECTORY's cap and conflict surfacing, RFC-0010's mid-link capability change) are new this week — and it is recorded here rather than left for a reviewer to report as an unimplementable MUST: they are implementable and unbuilt.",
    """
SIXTH INDEPENDENT REVIEW, 2026-08-25: 3 critical, 5 warning, 2 suggestion — and the cause is a THIRD kind, which is the answer the pass was run for. The first two are gone and verified gone: no stale text anywhere, and every frame and event name checks out against src/hub in both directions (ten observer frames, seven relay frames, six event kinds, exact match each way).

WHAT IS LEFT IS AT THE SEAMS. An obligation aimed at a different act than the one its own rationale names: `tool_receipt` was bounded by ATTRIBUTION, which is a provenance rule, while the hazard the same paragraph states is DELIVERY — naming the connection that sent a fabricated result does not stop it reaching the agent that is waiting. A bound meeting a closed answer set with nothing to say: the spool's per-peer cap had no overflow behaviour, and none of the seven delivery answers fits a send whose queue is full. And one rule locating its authorising fact on two different machines: `peer_connect` said 'configured on this machine' in one bullet and 'on that workbench's machine' sixty lines later, which coincide only when hub and workbench share a machine — and on a headless server hub the first refuses every dial.

Neither method that was added catches these. Whole-clause rewriting produces prose that is internally consistent-looking; implementation reconciliation checks NAMES. What these need is reading each MUST against the hazard its own rationale names, and against every other rule it borrows a term from. That is the method's fourth revision.

ALSO FIXED FROM IT: the drift the reviewer found in code — handlers.zig still called the relay link authenticated in two comments (the retraction had reached session.zig only), UnknownCause had three values where two clauses now require four, and RFC-0010 named the presence capability `presence` while the wire carries `presence_relay` — the clause that says a capability nobody spells the same way never matches, spelling it differently from the code. The RFC took the wire's name.""",
    "MY OWN FOURTH-REVISION PASS BEFORE THE SEVENTH REVIEW found a hole in what I had just written for the sixth. The tool_receipt bound said 'matched on that request's id' — and the id is a monotonic counter (run.zig mints `req-<n>`), so any observer connection could guess one and answer a question it never received. The bound rested on a property nothing provides. It is now the CONNECTION: a receipt is honoured only from the connection the hub routed that request to, which is evidence the hub holds rather than a hope about the id. Reading the MUST against its own hazard is exactly what found it, one round after the method was named.",
    """
SEVENTH INDEPENDENT REVIEW, 2026-08-25: 3 critical, 4 warning — and the answer to the question it was run for is NO SEVENTH CAUSE. All three are recurrences of causes already named, and two of the three were one edit from clean.

C1 was my own edit damage, of the shape the reviewer could name from the wreckage: replacing text that ended in 'WHAT THE HUB ENFORCES is what it can see:' left the OLD trailing half attached, so the sentence read 'what it can see: and MUST NOT accept an instruction to dial one the human has not named' — the only surviving MUST in the bullet being precisely the one the sentence above it disclaims as uncheckable.

C2 IS THE MOST USEFUL FINDING OF THE SEVEN PASSES, because it is about method rather than text. Before this pass I fixed tool_receipt's dependence on a guessable id — and did not sweep the sibling rule two bullets down, which keyed forward idempotency on the same kind of id and cited RFC-0008 C-MAILBOX for an 'envelope id, already unique per message' that C-MAILBOX never defines, that only deprecated RFC-0002 ever did, and that the code mints as a counter starting at zero in every pane daemon plus a literal 'send-0' on the out-of-pane path. A receiving hub would have accepted one send-0 forever and silently re-acked every later cross-machine message while the forwarding hub answered `forwarded` — the strongest success in the set. The method was right; the SWEEP was partial. Fixed by keying on (forwarding peer, message id), which is unique because the peer id is arbitrated even though the id inside it is not.

C3: a NACK arriving for a message already answered `spooled` had no defined outcome — the sender holds a success answer that stopped being true, and no kind existed to record the drop.

THE REVIEWER'S OWN JUDGEMENT ON STOPPING, recorded because it argues against my inclination: the count is flat (5,6,4,3,4,3,3) but the CHARACTER changed — six passes ago the defects were spread across the document, these three are concentrated and each is one edit from clean, and C2 in particular is a live testable silent-loss rule an implementer would build. It advises finishing rather than deferring.""",
    "SPEC AHEAD OF CODE, growing and now worth its own item rather than a note: RFC-0009 names thirteen event kinds and the hub mints six. Unbuilt: directory_capped, directory_conflicted, directory_refused, peer_capabilities_changed, spool_evicted, spool_refused. Also unbuilt are the relay frames relay_capabilities, relay_tool_request and relay_tool_response, the per-message forward ack behaviour (the frames arrive and nothing holds a copy), and UnknownCause.contested reaching the wire. None is a defect in the RFC — it is phase spec, and the clauses requiring them were written this week — but the list is long enough that 'the hub implements RFC-0009' is now false in a way somebody should be able to see without reading both.",
    """
EIGHTH INDEPENDENT REVIEW, 2026-08-25: 2 critical, 2 warning — both criticals NEW, both in prose written in the last two rounds, both cause 6, and both found the same way. THAT WAY IS THE FINDING: each was a sentence making a claim about src/hub that nobody had run the grep for. The fifth revision of the method is the reviewer's: a sentence asserting what the code already does is a CITATION, and gets checked like one.

C1: my (forwarding peer, message id) key was one scope too shallow. The evidence I cited for it says the counters are per PANE DAEMON — so two panes on one machine both send req-0 and the collisions are WITHIN a peer, which pairing with the peer does not fix. Re-keyed on an id the FORWARDING HUB mints for the link, which needs no argument about senders at all: the party that assigns it is the party that must not reuse it, and the same party retries.

C2: my tool_receipt bound said 'only FROM THE CONNECTION THAT HUB ROUTED IT TO' and asserted 'the hub already holds that bound'. Both false. toolForward BROADCASTS to subscribers and records only the REQUESTER's connection; a subscription is push-only; a receipt opens its own one-shot connection — so the two connections are never the same by construction. I replaced a hope about the id with different evidence the hub also does not hold. It is now a token the hub MINTS at forward time, which is the only value in the exchange it did not receive from somebody else — and the clause says plainly that handleToolReceipt does not do this yet, rather than claiming it does.""",
    """
TENTH INDEPENDENT REVIEW, 2026-08-25: 4 critical, 8 warning — and the answer to the question the pass was run for is A SEVENTH CAUSE, unlike the three passes before it. The count went 5,6,4,3,4,3,3,2,2,4 and the RISE is the finding: the earlier causes are all still gone (no edit damage, no stale name, no unchecked enumeration — the reviewer reconciled the ten observer frames, seven delivery answers, four causes and twelve event kinds against src/hub in both directions and found exact agreement), and what surfaced instead is a kind of defect no previous method looks for.

THE SEVENTH CAUSE: AN OBLIGATION THIS DOCUMENT MAKES UNEXECUTABLE. Not a wrong claim about code or a sibling — a MUST whose subject cannot obtain the value the MUST is written on, where every sentence involved is individually true.

C1: C-PRESENCE makes (hosting peer, generation) the unit of identity-continuity "never generation alone", RFC-0004 C-SUBSCRIPTION says the same of a snapshot it requires to include peer-hosted identities — and C-DIRECTORY's METADATA SCOPE said an advertisement carries identity and hosting peer and NOTHING ELSE. The generation never crossed. Two MUSTs read a field that never arrives, and a consumer keys on the identity alone while two clauses say it must not — which is exactly the substitution a generation exists to catch, on a path C-EVENT-LOCALITY guarantees arrives with no removal event to mark it. Fixed by putting the generation on the wire: the receiver cannot derive a count of registrations that happened on another machine, and the enumerating sentence one bullet up was corrected with it.

C2: the receiver's idempotency retention was sized "at least the spool TTL" — the SENDER's setting, which the same clause says four sentences up the receiving peer never observes. Sized by the specified constant instead, on both sides, and the consequence stated: lengthening a spool TTL buys longer spooling, not longer retrying, because past the window the receiver has forgotten the key and the retry is the duplicate the rule exists to prevent. No field added to a handshake RFC-0010 C-CAPABILITIES owns.

C3: `unknown` needs both conjuncts (every peer reachable AND none at its cap); RFC-0008 C-MAILBOX's federation qualifier carried only the first, while asserting "THIS ENUMERATION AND C-DELIVERY'S ARE ONE SET". Two normative clauses, one observable, opposite answers. Landed in RFC-0008, which owns it.

C4: the live-link retry loop had three stop conditions and none of them was "the directory answer changed". Both live-link transitions fell through: a conflict arising (C-DIRECTORY says route to NEITHER, and a blind retry keeps delivering to the first claimant — a sibling clause's MUST NOT made violable from here) and the ordinary graceful move (retried into the withdrawal, NACKed, dropped as spool_refused for an agent reachable one peer over). Three transitions became five, the two new ones first, and the retry loop gained the condition.

ALSO FIXED FROM THE WARNINGS: C-SUMMARY said the RFC "is written BEFORE the code", which stopped being true and, worse, told the next reader that present-tense claims need no grep — it now says the code has caught up in part and that every present-tense sentence here is a citation; C-SUMMARY also still framed the design as two kinds and claimed every connection-scoped invariant survives "untouched", both of which C-BOUNDARIES retracts. The observer citations named clauses that never name the frame (RFC-0003 has no `tool_request`, RFC-0005 no `wake_report`, RFC-0007 no `exec_receipt` — I verified all three myself), which is how `relay_refused` got deleted in round five; the rule is now stated once for the whole enumeration instead of marked on one member. `no_workbench` and `no_server` got a precedence rule for the state that satisfies both. A moved message was in two differently bounded queues depending on which sentence you read. Tombstones shared the live cap with no eviction, so a peer that churned its cap inside the retention window could never be answered `unknown` about again. And C-BOUNDARIES still announced that RFC-0011 C-DELEGATION "is corrected in the same change" — the correction landed rounds ago and the announcement was still in the future tense.

W4 I FIXED DIFFERENTLY FROM THE REPORT, after checking: the reviewer read it as a missing fifth `unknown_cause` value, which would have been a wire change across three RFCs and the code. But `unknown_cause` explains a status ON A ROW, and the unresolvable-target case has no row. The real defect is that wait answers "not registered" for a target this hub cannot see, asserting an absence it performed — the same truncation C-DELIVERY refuses to report as `unknown` on the send side, on the surface C-PRESENCE had already promised to hold "to the same standard".

MY OWN ARITHMETIC, CORRECTED: an earlier note here said this RFC names thirteen event kinds and the hub mints six, then listed six unbuilt. Six and six is twelve. The clause names TWELVE, and now says so — it had no stated count, which is why the slip lived in this work item rather than in the document.

