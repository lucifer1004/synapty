[content]
description = """
[[RFC-0016]] requires one binding table; this workbench has three, and they do not agree by construction.

WHERE A CHORD IS WRITTEN TODAY:

- `Sources/App/SynaptyCommands.swift` — 20 `.keyboardShortcut` modifiers on menu items.
- `Sources/Features/Terminal/TerminalSurface.swift` — a `switch` on `charactersIgnoringModifiers` inside `GhosttyNSView.performKeyEquivalent`, 14 cases.
- `Sources/App/SynaptyApp.swift` — two `NSEvent.addLocalMonitorForEvents` blocks (the quick-connect palette, and the ⌘⌥N / ⌘⌃N tier jumps).

⌘D, ⌘T, ⌘W, ⌘], ⌘[, ⌘1–9, ⌘F, ⌘=, ⌘0 and ⌘- are each written TWICE — once as a menu key equivalent and once as a case in the terminal view. Which one runs depends on whether a terminal holds first responder, a fact with no pixel on screen.

WHAT MADE THIS URGENT rather than merely untidy: ⌘K yielded to a focused terminal so that ghostty's `clear_screen` could keep the chord, and when the sidebar stopped competing for focus the terminal became the permanent first responder — so the palette's own shortcut stopped working in the one place the human spends their time. The immediate fix (⌘K to the palette everywhere, clear to ⌘⇧K) is in [[WI-2026-08-19-005]] and is a default, not a remedy: a chord another application has registered system-wide never reaches this process at all, and no default can be chosen that is safe from that. Only rebinding can.

WHAT THIS DELIVERS: the table, the dispatcher that reads it, the three call sites collapsed onto it, persistence of overrides, and a Keys page in the appearance panel that records a chord.

THE HUMAN HAS DECIDED TWO THINGS, and they are not open here: the table covers terminal-domain commands as well as the workbench's own, dispatched as ghostty actions, with ghostty's own binding set emptied, and the editing surface is a record-a-chord panel rather than a text configuration file.

THE NON-KEYBOARD PATH IS PART OF THE WORK, not an afterthought: [[RFC-0016]] C-UNBOUND requires every command in the table to be reachable without the keyboard, and the tier jumps (⌘⌥1–9, ⌘⌃1–9) have no menu item today. Either they gain one or they do not go in the table."""
notes = [
    """THE MECHANISM FOR AN EMPTY ENGINE BINDING SET EXISTS, checked before the obligation was written into [[RFC-0016]] C-TERMINAL rather than after. ghostty's config parser answers `keybind = clear` by emptying its binding set outright (`ghostty/src/config/Config.zig:7265` — "all keybinds cleared", set and tables reset). `GhosttyApp.loadSynaptyConfig` already loads a Synapty-managed fragment AFTER `ghostty_config_load_default_files`, so a `keybind = clear` line in that fragment overrides both ghostty's shipped defaults and the human's own `~/.config/ghostty/config` — which is precisely the displacement C-TERMINAL requires the workbench's documentation to state. `reloadConfig` rebuilds through the same path, so the emptying survives a live settings change.""",
    '''
THE COMMAND INVENTORY, taken from the three sites so the table is built from what exists rather than from memory.

WITH A MENU ITEM ALREADY (the non-keyboard path [[RFC-0016]] C-UNBOUND requires is in place): New Session ⌘N · New Tab ⌘T · Split Right ⌘D · Split Down ⇧⌘D · Close Split ⌘W · Next/Previous Split ⌘] ⌘[ · Next/Previous Tab ⇧⌘] ⇧⌘[ · Session 1–9 ⌘1–9 · Go to page 1–6 ⇧⌘1–6 · Quick Connect ⌘K · Keyboard Shortcuts ⇧⌘/ · Toggle Sidebar ⌃⌘S · Font bigger/smaller/reset ⌘= ⌘- ⌘0 · Find ⌘F · Toggle Settings Panel ⌘⌥P · Show Hidden Files ⇧⌘. · Arrange presets (menu-only, no chord — already the shape C-UNBOUND permits).

HOLDING A CHORD WITH NO NON-KEYBOARD PATH — each must gain one or stay out of the table: terminal Copy ⌘C and Paste ⌘V (the standard Edit menu's items are the PLATFORM's text-field verbs, which [[RFC-0016]] C-TABLE puts OUT; the terminal's own copy is a table command and has no surface of its own) · Clear Screen ⇧⌘K · Tab switching ⌘⌥1–9 · Pane focus ⌘⌃1–9 · Split via ⌘\ (an alias for Split Right, which is one command with two chords — C-TABLE permits at most ONE, so the alias goes or the command splits in two).

ALREADY WRITTEN TWICE, and therefore the first candidates for the collapse: ⌘D, ⌘T, ⌘W, ⌘], ⌘[, ⌘1–9, ⌘F, ⌘=, ⌘0, ⌘- each appear as a menu key equivalent AND as a case in `GhosttyNSView.performKeyEquivalent`.''',
    """
DECISIONS LEFT TO THE IMPLEMENTATION, raised in review and deliberately not settled in [[RFC-0016]] — recorded so they are made rather than discovered.

THE EDIT MENU IS WHERE THIS GETS ARCHITECTURAL. On macOS the thing that makes ⌘C reach a text field's `copy:` IS a menu item's key equivalent. If the shared Copy item installs the table's chord for TERMINAL copy after a rebind to ⌘⇧C, text-field ⌘C dies — which [[RFC-0016]] C-TABLE's OUT list forbids. The contract is satisfiable, because DISPLAYING a chord and INSTALLING it as a key equivalent are separable, and a second item carrying the platform verb is also available. Decide before laying out the menu layer, not after. The consequence to accept knowingly: with terminal-copy cleared, the shared item shows no chord while ⌘C still copies in a text field.

ESCAPE CANNOT CANCEL RECORDING as [[RFC-0016]] C-REBIND is literally written — bare Escape is not a chord, so it is rejected and the surface goes on listening. Every macOS recorder cancels on Escape. The rule is unambiguous rather than wrong; if the panel wants Escape to cancel, the clause needs an amendment rather than a local exception.

PRESSING THE CHORD OF A COMMAND WITH NO OBJECT: C-DISPATCH requires unavailability to be visible "wherever the command is SHOWN", and a keypress is not a place it is shown. Whether the press also gives feedback is open; pick one and be consistent.""",
    """
A LOCAL EVENT MONITOR RETURNING nil DOES NOT STOP A SwiftUI `Commands` KEY EQUIVALENT, found in use and not by review. The monitor resolved ⌘K, ran the command and consumed the event; fourteen milliseconds later the menu item's own equivalent fired and ran it again. On a toggle that is open-then-shut in one press: the palette appears not to notice it is already open, and the full-window scrim flashing reads as the whole screen blinking.

IT VIOLATED NO CLAUSE, which is why six review rounds did not catch it. [[RFC-0016]] C-TABLE forbids anything outside the table changing WHICH command a chord reaches — and both mechanisms read the table and reached the same command. The missing obligation was about HOW MANY TIMES, and C-DISPATCH now carries it. The drop is keyed to the ORIGINATING EVENT (timestamp and key code) rather than to a time window, because a window wide enough to catch the echo also swallows a human pressing the same chord twice, which is exactly how the defect was reproduced.""",
]

