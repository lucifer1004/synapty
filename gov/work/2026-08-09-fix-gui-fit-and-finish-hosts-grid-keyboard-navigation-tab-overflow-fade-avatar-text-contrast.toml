id = "WI-2026-08-09-019"
title = "fix(gui): fit-and-finish — hosts grid keyboard navigation, tab overflow fade, avatar text contrast"
status = "done"
created = "2026-08-09"
started = "2026-08-09"
completed = "2026-08-09"

[content]
description = """
Fit and finish, three unrelated rough edges found by using the app.

- The hosts grid could not be driven from the keyboard. `DSGridKeyNavigation` adds arrow navigation and Return-to-connect, with Return armed ONLY after navigation has started — otherwise Return in a freshly opened page would connect to whatever happened to be first — and disabled entirely while an editor is open.
- The tab strip cut off mid-glyph when it overflowed. A trailing fade, measured through a preference rather than assumed, shows that there is more.
- Host avatar tints were too light for the white glyphs drawn on them.

Landed in one batch with [[WI-2026-08-09-017]], [[WI-2026-08-09-018]] and [[WI-2026-08-09-020]]."""

