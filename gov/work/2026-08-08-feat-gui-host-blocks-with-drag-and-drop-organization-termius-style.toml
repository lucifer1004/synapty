[content]
description = """
Termius comparison round (groups design): Termius moves hosts to groups via multi-select drag-and-drop; we only have the Edit-Host picker. Per product direction, the host list switches from dense rows to draggable card BLOCKS (grid) — blocks are both the drag source and, via the group tree, the drop targets.

Fix: host list renders as a card-block grid; blocks are draggable (multi-select via Cmd-click drags the whole selection); the group tree rows and the Ungrouped pseudo-row are drop targets with hover highlight; dropping assigns/reassigns group membership (nil for Ungrouped); group rows are not yet draggable (reparenting stays in a later WI)."""

