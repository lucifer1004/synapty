[content]
description = "Occam-razor revision (user challenge, 2026-08-09): hooks were over-engineering. Per-state analysis: 'waiting' is the one state an LLM cannot emit itself (the model is suspended when a permission prompt appears) — but the P1 bell fires at exactly those moments on all three harnesses, so hooks would only re-derive an already-covered signal at the cost of per-harness plugin packaging, Codex's hook-trust model, and a 3-way evolving-API maintenance surface. 'register' is a reliable one-shot skill instruction (SYNAPTY_SOCK detection); 'done' is best-effort polish where misses are harmless (bell backstops). P3-lite: extend the existing synapty-task SKILL.md (already installed to ~/.claude|.codex|.gemini/skills by synapty skills install) with a pane-awareness section — register on start, notify done on completion, notify waiting when ending a turn with a question. Native plugins/hooks remain a documented escalation path IF real usage shows skill+bell insufficient."

