[content]
description = "Semantic layer on top of P1. KEY simplification: every leaf's spawn command already carries a unique synapty-run agent id (local-XXXX / remote deploy id) — Swift just discarded it on split. So agent->pane location is a PURE SWIFT map (leafAgents recorded at the four spawn sites), and the Zig surface shrinks to one additive path: synapty notify --state working|waiting|done -> IPC .notify (state field, additive to IpcRequest) -> daemon (identity from the run wrapper's socket) -> hub agent_status envelope -> registry AgentInfo.status -> list_agents payload -> AgentMonitor. Semantics: waiting/done set attention (review me), working clears. Claude Code hooks (Notification->waiting, Stop->done) land in the Agent Skills deliverable (P3, separate WI)."

