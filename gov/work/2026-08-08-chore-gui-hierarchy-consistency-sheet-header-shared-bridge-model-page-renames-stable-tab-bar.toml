[content]
description = """
Audit follow-up (UI/UX hierarchy round) — consistency cleanup:
- GithubConnectSheet is the only modal sheet without DSSheetHeader (hand-rolled title + Cancel).
- The GithubBinding model + refreshBinding/disconnect logic is duplicated in HubStatusView and SettingsPage (two struct names for the same entity).
- HostConfigSheet / HubStatusSheet are full pages but named "Sheet" (legacy modal thinking; the actual modal is GithubConnectSheet).
- PaneTabBar disappears while a session is a connecting placeholder (pane count 0), making the terminal chrome jump.

Fix: GithubConnectSheet uses DSSheetHeader; extract one shared GithubBridgeController (@MainActor @Observable) used by both Hub page and Settings page; rename HostConfigSheet→HostsPageView and HubStatusSheet→HubPageView (pure renames, behavior unchanged); render a stable tab bar for the active session even with zero panes (placeholder tab, disabled +)."""

