[content]
description = "Approved IA decision (2026-08-09): rather than adding Identities/Port Forwarding as new sidebar rows (6 to 8 rows), Hosts becomes the infrastructure workbench with segmented tabs Hosts | Identities | Forwarding — matching the app-wide grammar 'first-class page = domain, in-page tab = view' established by Tasks Board|Activity (WI-2026-08-09-007) and the hosts grid/list toggle. Identities tab absorbs the existing identities section and adds usage counts (referenced by N hosts / N groups). Forwarding tab is a read-focused global overview: rules grouped by host (host-level rules plus group-inherited ones via effectiveForwardings), per-rule active dot driven by tunnel state, edit jumps to the owning host/group editor panel — no second editor surface. Foundation already exists: PortForward model (-L/-R), host+group rules with inheritance, ForwardingsEditor in editor panels."

