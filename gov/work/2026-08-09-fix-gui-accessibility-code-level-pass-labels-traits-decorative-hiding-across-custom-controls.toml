id = "WI-2026-08-09-020"
title = "fix(gui): accessibility code-level pass — labels, traits, decorative hiding across custom controls"
status = "done"
created = "2026-08-09"
started = "2026-08-09"
completed = "2026-08-09"

[content]
description = """
A code-level accessibility pass over the custom controls, which carry no labels by default the way native ones do.

Labels on `DSIconButton` and `DSSegmented`. Decorative elements — keycaps, status dots, pane badges — hidden from assistive technology, since announcing them adds noise without adding information. Composite rows (host cards, list rows, tabs, session rows, task rows, forwarding rows) combined into single elements with their traits and actions, so a row is read as one thing rather than as its parts.

Landed in one batch with [[WI-2026-08-09-017]], [[WI-2026-08-09-018]] and [[WI-2026-08-09-019]]. CODE-LEVEL ONLY: a VoiceOver walk was left for the operator, and this work item does not claim one was done."""

[[content.acceptance_criteria]]
text = "code-level a11y sweep — every custom interactive control carries accessibilityLabel/traits; decorative badges and glyphs hidden from the accessibility tree; DSSegmented/DSIconButton/cards/tabs/rows covered"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "build+suite green; note in WI that a manual VoiceOver walkthrough remains for the user"
