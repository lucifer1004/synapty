[content]
description = """
Reproduced (log evidence): switching Light→Dark the FIRST time creates a second SynaptySettings instance (init log, different self pointer) that loads the disk state — which still holds the old light value because appearanceMode persistence is debounced (500ms) — and its init applyAppearance(light) overrides the just-applied dark appearance; ghostty then receives LIGHT. The second Dark switch works because the disk now has dark.

Fix: appearanceMode persists IMMEDIATELY (cancel debounce + synchronous save in its didSet) so any re-created instance loads the fresh mode; also log the init call stack to identify the instance re-creation source."""

