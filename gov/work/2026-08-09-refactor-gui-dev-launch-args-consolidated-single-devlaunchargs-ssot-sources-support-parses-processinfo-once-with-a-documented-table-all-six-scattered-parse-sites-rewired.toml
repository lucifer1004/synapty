[content]
description = """
Six places parsed `ProcessInfo` arguments directly, each with its own spelling of the same flags. A launch argument is a contract with the person debugging, and six independent parsers mean no single place answers "what arguments exist".

`DevLaunchArgs` (Sources/Support) became the sole parser: one documented table covering --page, --hosts-pane, --hosts-inspector, --quick-connect, --hub-popover, --tabs and --layout, with every scattered site rewired to it and zero direct parsing left outside it.

Spot-checked with `--page hosts --hosts-pane forwarding` and `--tabs 3`."""

