started = "2026-08-08"
completed = "2026-08-08"

[content]
description = """
Product feedback: All Hosts must NOT be a group block — the default view IS All Hosts. Termius navigates into a group and shows a breadcrumb (All Hosts / Group); clicking All Hosts returns to the initial view.

Fix: remove the All Hosts and Ungrouped blocks from the GROUPS section (only real groups + New Group remain); when a group is selected, the section header becomes a breadcrumb "All Hosts › Group" with All Hosts clickable (back to the default .all view); ungrouped hosts stay visible in the default view and hosts leave a group via the edit sheet's Group picker (existing). HostFilter.ungrouped stays in the model API (tests unchanged); drag-to-group stays."""

[[content.acceptance_criteria]]
