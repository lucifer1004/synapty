build.zig claims the hub cannot touch the Keychain, but hub imports tools
which imports github, and the deploy/test hub modules re-add github
explicitly — weakest exactly where the claim was written for.

The audit transcript under .claude/audits is a session artefact and is not in the tree; the findings this WI acts on are the ones written here."""

