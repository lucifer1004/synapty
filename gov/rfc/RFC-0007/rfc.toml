[[changelog]]
version = "0.2.0"
date = "2026-08-27"
notes = "The seal was broken twice: a refusal name that lost its owner, and an amendment announcement that had landed"
changed = ["C-EXEC-SCOPE deferred the machine-readable refusal `no_workbench` to RFC-0009 C-WORKBENCH-ROUTING, which was deprecated along with the rest of cross-hub workbench routing. The name is defined HERE now, because a refusal an implementer has to invent a string for is one two of them spell differently. The federation qualifier cites C-DELIVERY in its place."]
fixed = ["C-PRIMITIVES announced that finalizing this RFC would amend RFC-0004 C-EVENT-LOG's event-kind set. That set is extensible by later normative RFCs and already names this one, so the four exec kinds are defined here and carried there — a record of what the receiving clause reads, rather than a promise about a change."]

