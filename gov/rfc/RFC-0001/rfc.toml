[[changelog]]
version = "0.1.0"
date = "2026-03-26"
notes = "Initial draft, plus a 2026-08-26 amendment bringing the architecture overview into line with what the corpus specifies — no version move was made, and the entries below say what changed"
changed = [
    "C-L4-A2A describes a hub per machine peered over relay links, which is what RFC-0009 specifies, and keeps the central-Hub design as the record of what it replaced and why",
    "C-L4-A2A says where location transparency stops: the same call and envelope, and answers a local send cannot produce",
    "C-L1-SESSION no longer defers detailed failure handling — RFC-0014 gives a session a holder and RFC-0009 gives cross-machine mail a durable queue",
    "C-L1-SESSION no longer says there is no replay: a reattaching client gets the output produced while it was away, per RFC-0014 C-RESUME",
    "C-FUTURE marks multi-hub federation as landed rather than anticipated, and narrows cloud deployment to the part topology did not settle",
    "RFC-0009 and RFC-0014 are declared references — this RFC had none while five documents depended on it by name",
]
