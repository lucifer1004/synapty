#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-FUTURE"
title = "Future Directions"
kind = "informative"
status = "active"
since = "0.1.0"

[content]
text = """
The following directions are anticipated but not yet specified. Each will be addressed by dedicated normative RFCs or ADRs as the project matures.

**Multi-hub federation — DONE, not future.** This entry anticipated
hub-to-hub peering and it arrived: [[RFC-0009]] specifies the peer
protocol and has been normative since its own v0.1.0. It is left here
rather than deleted because a future-directions list that quietly loses
its entries teaches a reader that nothing on it ever lands. What it did
NOT bring is the scale this entry imagined — a few machines and tens of
agents, a small table and not a routing protocol.

**Persistent agent memory.** Agents currently have no shared memory substrate beyond what they maintain individually. A future layer may provide structured shared context — key-value state, conversation history, or task graphs — accessible through the A2A protocol.

**Recording and replay.** The VT engine's in-memory state enables point-in-time snapshots, but full session recording (with indexed replay and search) is a natural extension for debugging, auditing, and training workflows.

**Plugin and extension model.** Third-party extensions for custom notification handlers, alternative frontends, specialized introspection exporters, and domain-specific orchestration strategies.

**Remote and cloud hub deployment.** A hub already runs on every machine
that hosts agents, including remote ones, and peers with the others
([[RFC-0009]]) — so the part of this entry about not being restricted to
one machine has landed. What remains is the part that never depended on
topology: authenticated remote access, multi-tenant isolation, and secure
agent registration over public networks. Today a relay link carries no
attestation of its own and is trusted because the workbench established
the channel it runs inside; a hub reachable across a public network needs
something the workbench is not there to provide."""
