[[changelog]]
version = "1.1.1"
date = "2026-08-24"
notes = "C-HUB-REPO's federation qualifier names the party that can satisfy it"
changed = ["a relayed task-tool request carries the REQUESTER's hub-repo identity, since the relaying hub has no workbench and no configuration of its own"]

[[changelog]]
version = "1.1.0"
date = "2026-08-11"
notes = "RFC-0008 coordination: resume_ref registration field, durable-id attribution, version-skew rule"
added = ["register accepts optional resume_ref (harness session identity); task attribution uses durable ids when bound; hub-side queueing authoritative for deployed daemons (redeploy on skew)"]

[[changelog]]
version = "1.0.0"
date = "2026-08-09"
notes = "Presence polling retired per RFC-0004; version realigned past the 0.2-0.6 amendment history"
changed = ["C-EVENTS — the 5s agents presence poll is replaced by the RFC-0004 hub event subscription (push); activity/task polling unchanged, activity MAY migrate to the subscription later"]

[[changelog]]
version = "0.1.0"
date = "2026-08-05"
notes = "Initial draft — collaboration model pivots from agent dialogue to GitHub Issues as the shared task center"
changed = ["C-EVENTS and C-HUB-ROLE amended: the GUI refreshes its views by polling the hub (agents 5s, activity 5s, tasks 60s, a deliberate 2026-08-05 decision recorded in the work-item ledger) — the GitHub bridge itself stays request-driven (no poll tax on the API)"]

[[changelog]]
version = "0.2.0"
date = "2026-08-05"
notes = "Promoted to normative; added authentication clause (fine-grained PAT + Keychain)"

[[changelog]]
version = "0.3.0"
date = "2026-08-05"
notes = "Request-driven bridge replaces polling: login device hosts the GitHub bridge; remote agents' tool requests route through the hub to it"

[[changelog]]
version = "0.4.0"
date = "2026-08-05"
notes = "Added C-INSTALL: first-run onboarding (github login + mcp install auto-detect/write agent platform configs)"

[[changelog]]
version = "0.5.0"
date = "2026-08-05"
notes = "CLI over MCP: synapty task subcommands are the agent interface (C-CLI-TOOLS); onboarding is skills documents (C-SKILLS); mcp-serve demoted to deprecated compat layer"

[[changelog]]
version = "0.6.0"
date = "2026-08-05"
notes = "Added C-UI: GUI redesign around the task center (activity log, project task badges, task view, GitHub settings)"
