[[changelog]]
version = "0.1.0"
date = "2026-08-05"
notes = "Initial draft — collaboration model pivots from agent dialogue to GitHub Issues as the shared task center"

[[changelog]]
version = "0.2.0"
date = "2026-08-05"
notes = "Promoted to normative; added authentication clause (fine-grained PAT + Keychain)"

[[changelog]]
version = "0.3.0"
date = "2026-08-05"
notes = "Request-driven bridge replaces polling: login device hosts the GitHub bridge; remote agents' tool requests route through the hub to it"

[[changelog]]
version = "0.4.0"
date = "2026-08-05"
notes = "Added C-INSTALL: first-run onboarding (github login + mcp install auto-detect/write agent platform configs)"

[[changelog]]
version = "0.5.0"
date = "2026-08-05"
notes = "CLI over MCP: synapty task subcommands are the agent interface (C-CLI-TOOLS); onboarding is skills documents (C-SKILLS); mcp-serve demoted to deprecated compat layer"

[[changelog]]
version = "0.6.0"
date = "2026-08-05"
notes = "Added C-UI: GUI redesign around the task center (activity log, project task badges, task view, GitHub settings)"
