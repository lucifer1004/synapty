#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PERSIST"
title = "What Is Written and When"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
Persistence follows the workspace, and it no longer stops at the local machine.

- The persisted unit MUST be the workspace, and it MUST be everything [[RFC-0015:C-LAYOUT]] says a well-formed layout carries: its identity, name, pin state, archive state, ordering, its tree with each split's direction and ratio, the ordered stack in each slot AND which pane that slot has in front, and the focused pane. Front and focus are different facts — one per slot, one per workspace — and a round trip that returned the tree without them has returned a layout the human did not leave.
- EACH LEAF MUST PERSIST ITS CONTENT KIND, AND THE STATE THAT KIND NEEDS TO COME BACK AS ITSELF. Enumerated, because a requirement nobody can fail is not one: a terminal leaf persists its working directory, its resume plan, and the agent id it was running — and only a terminal leaf has one, because only it runs a child ([[RFC-0015:C-CONTENT]]). THE PERSISTED ID IS A RECORD, NOT A GRANT: [[RFC-0008]] makes the hub the sole deriver of durable ids, so restore MUST use it to re-associate the leaf with a child that SURVIVED — a remote one held across the client's departure — and MUST NOT confer it on a newly started child. WHAT DECIDES IS WHETHER A HOLDER IS THERE, not whether the machine is this one: C-UNARCHIVE retracted the claim that a local child is mortal by construction, having measured one outliving the process that started it. So a restored pane re-associates where the recorded session answers and starts under whatever id the hub derives next where it does not, on either kind of machine, and the recorded id is then history. Reusing it would route another process's A2A traffic to the wrong place, which is the failure this record exists to prevent rather than to cause; a file leaf persists the directory it was showing; a browser leaf persists its address; a services leaf persists nothing further of its own, because what it shows belongs to the machine and is re-read on restore. A kind admitted later MUST have its durable state enumerated here by the amendment that admits it.
- A WORKSPACE ALSO PERSISTS THE PANES ARCHIVED FROM IT ([[RFC-0015:C-PANE-ARCHIVE]]), each with what its kind needs to come back as itself under the enumeration above. THEY ARE NOT IN THE TREE, which is why they need saying: a reader who takes "everything a well-formed layout carries" as the whole list writes a store from which every set-aside pane is missing, and what is missing is a live session nothing then names.
- A LEAF ALSO PERSISTS WHAT ANOTHER RFC REQUIRES OF IT, and this clause does not overrule them. The name the human gave a pane and whether they renamed it are the pane's own; the armed bit is the human's standing choice for that pane and [[RFC-0005]] C-AUTHORITY requires it to ride the snapshot. An earlier draft of this clause said "nothing beyond that enumeration", which read as forbidding all three — a closed list is only safe where it is the only authority, and this one is not.
- WHAT IS FORBIDDEN IS STATE NOBODY REQUIRES AND THE HUMAN DID NOT CHOOSE. For a browser leaf that means its history, its scroll position and anything a site left behind, and the reason is worth keeping: restoring an address is restoring where the human was, while restoring a session is re-entering it on their behalf. The test is whether a clause somewhere requires it or the human set it deliberately, not whether it appears in the list above.
- EACH PERSISTED LEAF MUST RECORD THE HOST IT WAS BOUND TO, not the connection's runtime identifier. A connection is a live object that does not survive a restart; the host is the durable fact, and restore re-acquires a connection from it ([[RFC-0015:C-RESTORE]]).
- REMOTE LAYOUT MUST BE PERSISTED, on the same terms as local. The prior model wrote a full layout for local sessions and only a label and host for remote ones. That asymmetry was correct while nothing on the far side outlived the client, and [[RFC-0014]] removes its premise: a holder that keeps the pty is what a restored remote layout attaches to.
- Live connections MUST NOT be persisted. Dial state, tunnels and control sockets are runtime, and a persisted `connected` would be a claim about the world that is false the moment it is written.
- THAT IS A PROPERTY OF THE FACT, NOT OF THIS STORE. The rule above reads as a rule about the workspace file because that is where it was first needed, and a reader who takes the scope literally will write the same falsehood into a different file — which has happened: a control socket path was written to disk elsewhere, survived the process, and was read back as authoritative about where a live channel should go. Wherever a control socket is recorded, the record MUST be verified against what is live before it decides anything ([[RFC-0013]] C-AUTHORIZATION states the obligation on the recorder).
- Persistence MUST NOT depend on the workbench exiting cleanly. A workspace's arrangement MUST be recoverable after a crash, which means writing on change rather than only at termination.
- A write MUST NOT be able to leave the store truncated or half-written. The failure this forbids is concrete: an empty or partial file is indistinguishable from "no workspaces".
- The persisted shape MUST carry a version. A store at any other version MUST be discarded rather than converted, for as long as [[RFC-0015:C-UNRELEASED]] holds."""
