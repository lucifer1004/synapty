#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-DERIVED"
title = "What the Workbench May Take From What a Pane Shows"
kind = "normative"
status = "active"
since = "0.3.0"

[content]
text = """
The workbench reads what a pane is showing and derives facts from it. What it may read, and what it may then do, are settled here. [[RFC-0014:C-CONFINEMENT]] bounds what the HOLDER may do with a session's contents and expressly defers what an attached client may do with what it lawfully receives to the artifact that authorises the client; for a pane's contents, this is that artifact.

WHAT WAS ALREADY SETTLED IS ONE READ FOR ONE PURPOSE, AND IT IS NARROWER THAN WHAT FOLLOWS. [[RFC-0004:C-PASSIVE-DETECTION]] authorises reading the final rows of the ACTIVE screen together with the OSC title, and bounds the output of that read to a status enum and nothing else. Both halves stay binding on the detector that clause governs. A derivation may need what the human scrolled to, which no clause has authorised, and may produce something that is not a status.

THESE RULES ARE PROPERTIES OF AN ACT, NOT A LIST OF PLACES. An earlier form of this clause enumerated the destinations a derived value could reach and forbade the rest, and it was wrong four times over: it forbade the system pasteboard, the log line [[RFC-0012:C-DESTINATIONS]] requires, the clipboard write a human had enabled, and opening an address at all. Each failure was silent, because a forbidden destination looks exactly like a feature that does nothing. A list of places also cannot be written in advance — the human already has a copy command, so any pane text can be anywhere they want it in two gestures, and a rule about where the WORKBENCH may put that same text bites only where the workbench acts unasked. That is a question about the act.

## What may be read

- WHAT MAY BE READ IS STATED PER KIND, because the kinds do not hold the same thing ([[RFC-0015:C-CONTENT]]). A TERMINAL LEAF's active screen and retained scrollback MAY be read. A FILE LEAF's listing and a SERVICES LEAF's offers are the workbench's own rendering of facts obtained elsewhere and are not read under this clause. AN AGENT NAMES AN OFFER BUT DOES NOT NAME ITS DESTINATION: `expose` takes a port and a validated path, and the address is the workbench's own construction ([[RFC-0013:C-PRIMITIVES]]), so there is no declared target to contradict the label and rule two has nothing to compare. A KIND THAT LET AN AGENT SUPPLY BOTH WOULD BE UNDER RULE TWO, and the amendment admitting it owes that. A BROWSER LEAF's page is a remote document: the workbench MUST NOT derive an affordance from it or treat it as input to any rule here, which leaves showing the page's own title in the chrome C-CONTENT already requires to be visibly not this application.
- A PANE'S STATUS MUST BE THE SAME WHATEVER THE HUMAN IS LOOKING AT. [[RFC-0004:C-PASSIVE-DETECTION]]'s classification MUST depend on nothing but the inputs that clause names — the rows it names plus the OSC title — the manifest the pane's registered tool selects, and its own sampling schedule. No derivation may influence any of the four: not the verdict, not which rows are read, not which manifest applies, not when a sample is taken. Losing an input is not a safe failure here, because that clause's rules are ordered and first match wins. Scrolling MUST NOT change a status, and neither MUST any affordance the workbench has drawn over the pane.

## One: contents are data, never instruction

- A PANE'S CONTENTS MUST NOT SELECT WHAT THE WORKBENCH DOES. They may not choose which of its commands runs, may not name a workbench object for one to act on, and may not change a rule the workbench applies. A pane shows what a program printed, and an agent prints what it read — a README, an issue body, a page it fetched. [[RFC-0013:C-REQUEST-NOT-SEIZE]] names this threat for content an agent asks to have presented; the same material reaches the same window unasked, by being printed.
- WHAT THIS DOES NOT REACH IS THE EMULATOR'S OWN JOB. A child sets a title, reports a directory, moves a cursor, rings a bell and asks for the clipboard, and honouring those is what a terminal IS. Nor does it reach a conclusion the workbench drew for itself: [[RFC-0004:C-PASSIVE-DETECTION]] classifies a pane from its output and [[RFC-0005:C-STATE-GATE]] turns injection on that classification — pane contents causing a workbench act, lawfully, because what the workbench acts on is its own verdict rather than the child's instruction. A DECLARED HYPERLINK TARGET IS THE ONE CHILD-CHOSEN DIRECTIVE THIS CLAUSE ADMITS, and rule two states the conditions.
- A DERIVATION MAY PRODUCE A VALUE OF ANY SHAPE. The narrower bound in [[RFC-0004:C-PASSIVE-DETECTION]] holds for the classifier it names and generalises to nothing else.

## Two: an act must be what it appears to be

- WHERE A CHILD SUPPLIES DISPLAY TEXT AND A TARGET SEPARATELY — a hyperlink escape is the case in hand — THE DECLARED TARGET MAY BE FOLLOWED, AND WHAT DECIDES IS WHETHER THE DISPLAYED CHARACTERS THEMSELVES CLAIM A DESTINATION. Where they do not, the declared target is an abbreviation and may be followed: `main.zig` standing for a full path is what the escape is FOR, and refusing it breaks every tool using it as intended while protecting nobody, since characters naming no destination cannot misdescribe one. Where they do, and it is not the destination the target names, THE HUMAN MUST BE ASKED AND SHOWN BOTH. Text reading as one address while opening another is the one deception a human reading their own screen cannot detect.
- COMPARED AS DESTINATIONS, AND NOT AS STRINGS. Shortening a link for display is ordinary, so equality is the wrong test and would fire on good-faith output all day. An address is compared by HOST, ignoring path, query and port — a tracking parameter is not a lie about where you are going, and a different host always is, including one the shown name is merely a prefix of. A path is compared by ancestry, after folding `.` and `..`, because whoever opens it will fold them. A shown destination of one kind against a target of another is already a contradiction, as is a target that cannot be read at all.
- WHAT COUNTS AS DISPLAYED IS WHAT THE HUMAN IS READING AT THE POINT OF THE ACT. A hyperlink's span may be a phrase; an implementation that compares less than the span MUST say which characters it compared, because a rule whose answer varies with pointer position is not a rule.
- THE RESOLVED TARGET MUST BE SHOWN IN FULL BEFORE THE ACTION IS TAKEN, and this is not only the deception's mitigation. It is the whole answer to an agent printing `https://host/?d=<secrets>`: text and target agree, so there is nothing to detect, and what the human is shown IS the payload.
- A WORKING DIRECTORY MUST COME FROM A SOURCE THE CHILD CANNOT CHOOSE — the process table, or a holder that reads it ([[RFC-0014:C-PWD]]) — which places it outside session contents as process metadata, disclosable beyond the attached client only subject to [[RFC-0014:C-ENTITLEMENT]]. PROVENANCE AND NOT MECHANISM: a local pane has no holder where the human refused durability ([[RFC-0014:C-SCOPE]]), and the kernel answers for it. The same fact ANNOUNCED by the child is a string the child chose and MUST NOT be used where this clause calls for a directory; C-PWD makes the distinction itself.
- WHAT OPENS MUST BE BOUND TO THE SOURCE PANE'S CONNECTION ([[RFC-0015:C-LEAF-BINDING]]). A path printed by a remote pane is a path on that machine, and resolving it against this one would open a different file wearing the same name.
- A TAKEN ACTION THAT FAILS MUST BE REPORTED AS A FAILURE, naming the machine.

## Three: nothing happens until the human asks

- AN OFFERED ACTION IS INERT UNTIL IT IS TAKEN. A derivation MAY render an affordance on the text it recognised. It MUST NOT perform the action, MUST NOT perform it on hover, focus, selection or arrival, and MUST NOT be the default target of a keypress.
- RESOLVING FOR DISPLAY MUST NOT REACH ANOTHER MACHINE. No fetch, no probe, no preview that contacts a host the text named. THE ASYMMETRY IS THE POINT and is what makes this the strongest rule here: an agent on a remote pane cannot make a request from the human's machine, with the human's address, inside the human's network. A workbench that probes on its behalf hands it exactly that, for the price of printing a string.
- A READ OF WHAT IS ALREADY ON THE PANE'S OWN MACHINE IS NOT THAT. Asking the filesystem whether a name exists, over the connection the pane already holds, tells an agent nothing it could not read itself at no cost — so it MAY be done, and an implementation MAY decline it where the answer costs a round trip. This is what lets a recognised path open the file rather than the directory above it, and lets a name that resolves nowhere go unmarked.
- AN AFFORDANCE MUST BE RESOLVED AGAIN WHEN IT IS TAKEN, and MUST NOT OUTLIVE THE TEXT IT WAS DERIVED FROM. The directory moves under it; the characters leave the pane. Where they are gone — evicted under the holder's retention bound ([[RFC-0014:C-RETENTION]]) or out of the grid the workbench keeps, cleared, overwritten, or absent from a screen delivered after a resumption point was refused ([[RFC-0014:C-RESUME]]) — it MUST be withdrawn rather than taken.
- AN AFFORDANCE WITH NO ACTION WIRED TO IT MUST NOT BE DRAWN. A mark that invites a gesture and does nothing spends the human's attention on a promise the workbench will not keep. This is about what is WIRED, never about whether the target is there — deciding that is the previous bullet's business and its answer may be no.
- WHERE A DERIVATION YIELDS MORE THAN ONE CANDIDATE, THE WORKBENCH MUST NOT CHOOSE AMONG THEM, AND MUST OFFER THEM. A prohibition with no permitted alternative is a feature that does nothing; picking is a human act like any other here. THIS HAS NO INSTANCE IN A RESOLVER THAT IS PURELY SYNTACTIC AND HAS ONE BASE, which is why nothing implements it today — one span yields one target. It binds whatever admits a second base, a search path among them.
- WHEN THE HUMAN TAKES IT, THE ACT IS THEIRS. It does not enter the queue [[RFC-0013:C-REQUEST-NOT-SEIZE]] requires, and the rules protecting a human from an unasked-for arrival — ordering, focus, not being covered — do not apply to a thing they asked for.

## Four: what the human did not send does not travel

- THE WORKBENCH MUST NOT PUT A PANE'S CONTENTS ANYWHERE THE HUMAN DID NOT DIRECT THEM. Three things direct: an act the human takes, a STANDING CHOICE they made about that channel, and a normative clause. A selection reaching the pasteboard is the first ([[RFC-0016:C-TABLE]] makes copying from a terminal a command; that it lands on the pasteboard is what copying means). A clipboard write a child asks for is the second, admitted because the human turned that channel on and may turn it off. A status edge crossing a peer link is the third ([[RFC-0009:C-PRESENCE]]), as is an excerpt returned to a requesting agent ([[RFC-0007:C-READBACK-TRUST]]).
- ANYTHING WITH NONE OF THE THREE BEHIND IT IS THIS CLAUSE'S SUBJECT DISCLOSING ON ITS OWN ACCOUNT: telemetry, a crash report, a sync store, a search index, a scripting or automation surface an unattended program can drive. THE SYSTEM'S ACCESSIBILITY INTERFACE IS NOT ONE OF THOSE — it is how the human at this machine READS what is in front of them, it discloses nothing that is not already on their screen, and a rule reaching it produces a pane some humans cannot read at all.
- A DERIVED VALUE THAT LEAVES THIS MACHINE MUST NOT CARRY WHAT PRODUCED IT. "This agent went to waiting" may cross a peer link; the line that made the classifier decide so may not. [[RFC-0009:C-PRESENCE]] states the same division from the other side — a peer "RELAYS A CONCLUSION, it does not re-merge evidence it never saw" — and [[RFC-0009:C-EVENT-LOCALITY]] forbids replaying a peer's events at all.
- THE WORKBENCH'S OWN DIAGNOSTICS MAY NAME WHAT FAILED AND NOT THE OUTPUT IT WAS FOUND IN. [[RFC-0012:C-DESTINATIONS]] requires a component on this platform to log to the system's own store and [[RFC-0012:C-TWO-CHANNELS]] names the path among the identifiers such a line carries, so a resolved target belongs in it. The surrounding rows do not — and the price is real rather than absent: when a resolution goes wrong, the source row is the only datum that explains it. The unified log is a shared surface and pane contents do not belong on it, which is worth that.
- WHAT IS PERSISTED IS WHAT A CLAUSE REQUIRES. A file leaf opened by a taken action persists its directory like any other ([[RFC-0015:C-PERSIST]]) — the human's act reaching durable storage. Nothing else derived from a terminal leaf's text is required to be persisted, so nothing else may be.

## Five: what is handed to another program must be judgeable from what was shown

- THE PERMITTED SCHEME SPACE FOR A TAKEN ACTION MUST BE AN ALLOW-LIST STATED IN THE WORKBENCH'S OWN DOCUMENTATION. Rules one through four settle whether the workbench acts, and whether the act matches what it showed. None of them bounds WHAT KIND OF THING is handed off — so an honestly displayed, informedly taken target still reaches the system opener, which on this platform resolves a scheme to a registered application and launches it. A human cannot judge that consequence from the string: `https://` says what will happen and `x-vendor://` names an application they have no way to read out of it.
- [[RFC-0015:C-CONTENT]] MADE THIS ARGUMENT ALREADY, for the browser leaf, and required the bound before a human could create one. This clause opened a second path to the same capability and inherits the obligation rather than the mechanism.
- A FILE IS SHOWN RATHER THAN LAUNCHED. Handing a file to the system opener starts whatever application claims the extension, which is the one thing rule five exists to bound; a file leaf on the directory that holds it is the same information without the launch.
- IT MUST NOT RUN A PROGRAM ON THE PANE'S MACHINE, and MUST NOT open a TERMINAL LEAF, which is the kind defined by running one. Asking the system to open an address in an allowed scheme is the single admitted exception, and it is the human's act.
- IT MUST NOT COPY THE TARGET'S CONTENTS ANYWHERE. Listing a directory over the connection it already lives on is showing; fetching a file onto the human's disk because untrusted text named it is not.
- ATTRIBUTION IS OWED BY WHAT OPENS INSIDE THE WORKBENCH: it MUST name the pane and the agent whose output the text was read from, and an artifact shown in it MUST wear the frame [[RFC-0013:C-REQUEST-NOT-SEIZE]] requires. HANDING AN ADDRESS TO THE SYSTEM SURRENDERS ATTRIBUTION — no browser will name a pane — which is why rule two's "shown in full first" carries the whole weight there, and why rule five bounds what may be handed over at all.

WHAT THIS CLAUSE DOES NOT SAY is where a derived value may go. Every rule above is a property of an act: whether the workbench was asked, whether what it did matches what it showed, whether it treated contents as an instruction, whether the thing handed off is one the human could judge. That is answerable about one act in isolation, and it does not go stale when the product grows a surface — which the list it replaced did, four times, silently."""
