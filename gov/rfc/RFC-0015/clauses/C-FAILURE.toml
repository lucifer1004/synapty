#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-FAILURE"
title = "Where a Connection's State Is Shown"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
Once one slot can hold two machines, a connection's state has exactly one place it can honestly be shown: on the panes that reference it.

- The dial state of a connection — `connecting` with its progress, or `failed` with its reason — MUST be presented on each leaf bound to it. It MUST NOT be presented as a property of the SLOT or the workspace containing that leaf, because neither of those has one connection to be in a state about — a slot's stack may hold panes from two machines ([[RFC-0015:C-LEAF-BINDING]]). A pane's own tab is not a container in that sense: it is that one pane's handle, so it names that one pane's connection, and showing the state there is showing it on the leaf.
- A workspace in which two hosts are dialling at once MUST be able to show both, independently.
- A failure MUST carry the reason it failed and MUST persist until the human dismisses it or a reconnect succeeds. A failure that clears itself leaves the human with a pane that stopped working and no account of why.
- A GAP IN WHAT A PANE CAN SHOW IS OWED A NOTICE OF ITS OWN, EVEN THOUGH NOTHING FAILED. Where the connection could not deliver everything the session produced — a position the holder would not continue from, a catch-up the child outran ([[RFC-0014:C-RESUME]]) — the pane carries a screen that looks complete and is not, and the human's only way to find out is to scroll up into output that was never there. The workbench MUST say so on that pane. Unlike a failure it MUST be dismissible, because it reports a fact about the past rather than a condition that is still true; and unlike a failure it MUST NOT be cleared by the connection recovering, because nothing fills the gap back in.
- ALL OF THIS IS WORKBENCH UI AND MUST NOT BE WRITTEN INTO THE TERMINAL. The pane is the session's screen: progress, failures, docking affordances and connection chrome MUST be drawn by the workbench over or around the pane, and MUST NOT be emitted as bytes into it. A CLIENT WITH NO WORKBENCH IS THE ONE EXCEPTION AND IS NOT ONE: where the human's own terminal IS the surface, there is no pane to draw over, and the same sentence goes to that screen.
- The workbench MUST NOT require the human to open a workspace to learn that something in it failed. A workspace containing a failed connection MUST be distinguishable in the sidebar — without that, work put aside fails silently and is discovered only on return."""
