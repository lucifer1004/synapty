[[changelog]]
version = "0.2.0"
date = "2026-08-27"
notes = "The seal was broken three times: a security argument corrected, a federation gate retargeted off a deprecated clause, and a retired premise removed"
changed = ["C-WAKE-TRIGGER's federation qualifier pointed at RFC-0009 C-WAKE-LOCALITY, which is now deprecated, and gated injection on BOTH of that clause's conditions. RFC-0009 deferred cross-machine delegation outright (C-NON-GOALS), so there is no second condition: the only gate is RFC-0011 C-HEADLESS-GATE's, and the qualifier now cites C-DELIVERY."]
fixed = [
    "C-AUTHORITY claimed a remote wake's guarantee was 'workbench-trust plus link authentication'. There is no link authentication to add — a peer id is self-reported on the same footing as an agent id — and the sentence cited RFC-0009 C-BOUNDARIES for the opposite half of the same thought. No document may rest a security argument on peer authentication, and this one no longer does.",
    "C-WAKE-ACK justified telling the human rather than escalating by 'V1's happy-path posture', a premise this project has retired. The rule is unchanged; its reason is now the one that holds — the two readings of an unacknowledged wake call for opposite actions, and acting on the wrong one acts on the wrong pane.",
]

