#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PRIOR-ART"
title = "Prior Art — herdr's Managed Runtime"
kind = "informative"
status = "active"
since = "0.1.0"

[content]
text = """

herdr (Apache-2.0, studied 2026-08-11 from a local checkout) implements
all three lifecycle rungs and calibrated this RFC's choices:

- 'agent start <name> --kind <tool>' spawns a managed agent into an
  existing pane, validates the agent identity, and rejects prompts while
  startup is pending. NOT adopted: Synapty built it and took it out
  again. Starting a tool is typing its name, with whatever options that
  run needs, and a fixed per-tool recipe carries none of them — so it
  could only ever serve the case that was already free.
- agent_resume: pending resume candidates carry a plan (pane, terminal
  id, cwd, size) and fire once the UI theme/geometry settles. NOT
  ADOPTED, and the difference is the whole of C-RESUME-RESTORE: herdr
  auto-resumes, and this project does not resume on its own initiative
  at all. There is no automatic mode and no preference that enables one,
  so the wait-for-surface discipline and the ask-first preference this
  entry once credited Synapty with are things it does not have — they
  were removed with automatic resume and the credit was left standing.
- handoff_runtime transfers PTY master fds, sizes, keyboard-protocol
  state, and serialized history between server generations, explicitly
  dropping transient waits/subscriptions. This is the proven shape of
  the rung Synapty defers (C-PTY-HANDOFF) and the reference design if a
  headless core ever makes it viable."""
