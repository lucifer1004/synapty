[[changelog]]
version = "0.2.0"
date = "2026-08-28"
notes = "The refusal reasons are five, and two of them were being sent unnamed"
changed = ["`directory_overflow` is named, for a peer hosting more identities than the receiving hub will record for one peer. RFC-0009 C-DIRECTORY now requires the link be refused rather than the surplus identity dropped."]
fixed = ["C-COLLISION said FOUR CONDITIONS, THREE CODES while the hub was sending a fourth. `malformed_hello` -- a hello carrying no version range or capability list -- was invented by an implementer because the clause left them needing a string, which is the exact failure the bullet exists to prevent. It is named now, with the reason it is not `version_incompatible`: a hello with no range is not an old peer whose range fails to intersect, it is a frame this protocol does not define, and the remedy is to replace that build rather than move either side's version."]

[[changelog]]
version = "0.1.1"
date = "2026-08-25"
notes = "Capabilities are named and updatable; unknown_cause carries a contested identity"
changed = [
    "C-CAPABILITIES names the capability strings and adds relay_capabilities, since a set fixed at handshake cannot express a workbench detaching",
    "C-DIAGNOSABILITY's unknown_cause gains contested",
]

