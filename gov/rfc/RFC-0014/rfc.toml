[[changelog]]
version = "0.3.0"
date = "2026-09-01"
notes = "Displacement is told to the human on both sides of it"
changed = [
    "C-ONE-CLIENT requires the displaced client's human to be able to read why the session ended — a notice written into a surface the same act destroys has not been delivered",
    "C-ONE-CLIENT requires an attach offered to a person as a way back to their own work not to displace another client unannounced, and requires a client to be able to learn beforehand that it would",
    "C-ONE-CLIENT records that input having no owner, not the pseudoterminal having one size, is why a second attached client is refused, and that an observer sending no input is not decided here",
]

[[changelog]]
version = "0.2.0"
date = "2026-08-29"
notes = "One determination for whether a holder is running, and the remains of one that is not"
added = ["C-LIVENESS requires liveness to be decided by a fact the system ties to the process, never by a process identifier alone, and requires every surface to reach the same determination"]
changed = ["C-END adds that a holder that is gone is not a session — enumeration must neither report nor retain what named it"]

