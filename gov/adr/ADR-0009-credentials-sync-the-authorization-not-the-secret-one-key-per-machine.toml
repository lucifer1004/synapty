#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0009"
title = "Credentials: sync the authorization, not the secret — one key per machine"
status = "accepted"
date = "2026-08-14"
refs = ["ADR-0008"]

[content]
context = """
The decision to sync host configuration across a human's Macs makes that configuration portable across a human's Macs. It does not make a host USABLE on a second Mac, and the gap is the credential: a HostEntry carries `sshKeyPath`, a path into ~/.ssh on the machine that wrote it. Sync that row to a new Mac and it names a key that is not there.

So the feature as specified delivers a host list you can read and cannot connect with, which is most of the friction it was meant to remove.

PRIOR ART, and the reason this needs a decision rather than an implementation. Termius solves it by storing the SSH private key ITSELF, syncing it through Termius's infrastructure, and having the human register the resulting public key on their servers. A new install is immediately usable. That is a real answer and it is the obvious one to copy.

WHAT COPYING IT WOULD COST HERE. The private key would have to live somewhere that replicates. On this platform the honest place is iCloud Keychain (`kSecAttrSynchronizable`), which is end-to-end encrypted and which Apple cannot read — better than a vendor's servers, and not the point. The point is BLAST RADIUS: a key that reaches every Mac signed into an Apple ID means one compromised Mac is fleet-wide SSH access. Today a key on one Mac is a key on one Mac. That is a change of threat model, and The same principle is already stated for the GitHub credential — a widening must be an explicit choice and never a side effect of turning sync on. It would also make Synapty a CUSTODIAN of key material, which carries obligations (rotation, passphrase handling, secure deletion, backup) this project has not taken on and should not acquire by accident.

A DIFFERENCE FROM TERMIUS THAT CHANGES THE ANSWER. A credential here has two consumers, not one. The human's terminal pane is interactive — an ssh password prompt appears in the PTY and gets typed, which is why password auth half-works today with no code. The workbench's own machinery is not: it scps a binary, starts a hub, holds a ControlMaster and a reverse tunnel ([[ADR-0008]]), all non-interactive, where a prompt is fatal. Termius only has to open a shell. "Incomplete credential" is therefore a stronger condition here, and it has two distinct answers rather than one."""
decision = """
Sync the AUTHORIZATION, never the secret. Each Mac holds its own SSH keypair and is enrolled on a host by a Mac that already reaches it.

ONE KEY PER MACHINE. A Mac mints an ed25519 keypair on first run, named by its peer id. The private half lives in ~/.ssh and MUST resolve outside the directory replication copies — not merely outside iCloud, but outside the specific tree sync carries, which is the only boundary that can actually be asserted. The public half is published INTO that tree, because a public key is not a secret and publishing it is what lets one Mac enrol another without either handling private material.

ENROLMENT IS AN EXPLICIT HUMAN ACT. Writing a key into someone's authorized_keys grants standing access, so it happens behind a menu item, a sheet and a button — and never as a consequence of adding a host, connecting to one, or turning sync on. An already-authorized Mac performs the write over its own working connection; the enrolling Mac never possesses the enrolled Mac's private key, and cannot, because that half never left the machine that made it.

THE REMOTE WRITE IS APPEND-ONLY AND IDEMPOTENT. `umask 077` and `mkdir -p ~/.ssh` are not hygiene: sshd ignores authorized_keys ENTIRELY, logging nothing a human will read, when the modes are wrong — the write succeeds, the content looks right, and the key does not work. Every other line in that file was put there by someone else for reasons we know nothing about, so the append never truncates and a re-run adds nothing. REVOCATION MATCHES KEY MATERIAL, NOT THE COMMENT, because the comment drifts when a peer id is re-minted and matching it would leave a WORKING key behind exactly when the label had moved.

WHICH KEY IS PRESENTED, which is where this decision either pays off or does nothing. In order:

1. The key the host record names, if it exists on THIS machine.
2. Otherwise, if the record NAMES a key that is not here, this machine's own key — this is the case the decision exists for, a record written on another Mac naming a path that does not exist on this one.
3. If neither is on disk, the configured path is still reported, so a failure names the file the human expected rather than saying nothing.
4. IF THE RECORD NAMES NO KEY AT ALL, NO IDENTITY IS OFFERED. This is not case 2 and must not be folded into it. A host with no key named is the ordinary setup for anyone using ssh-agent or ~/.ssh/config, and handing it this machine's dedicated key presents an identity no host has authorized — measured against a live host, the same command succeeds without `-i` and returns "Permission denied" with it.

Cases 2 and 4 look alike in code and are opposites in effect. Conflating them broke connecting to thirteen of fourteen hosts while every test still passed, because all of them asked which path was returned and none could ask whether a connection worked.

WHAT THIS DELIBERATELY DOES NOT DO: it does not solve the first Mac, it does not make Synapty a custodian of key material, and it does not reach hosts the workbench cannot already run a command on. Those are stated in the consequences rather than papered over here."""
consequences = """
GAINED. A new Mac becomes usable without any secret being copied anywhere, by any route, including one the human might choose badly. Revocation becomes per-machine and precise: a stolen laptop is one line removed from each host, and the other Macs keep working — where a shared key would have to be rotated everywhere, disturbing every machine to punish one. Servers gain an accurate answer to "which Mac connected", because the connecting key identifies it. And Synapty never becomes a custodian of key material, so it inherits none of rotation, passphrase handling or secure deletion.

PAID, and none of it is hypothetical.

The first Mac is not solved by this. Enrolment requires an already-authorized machine, so machine number one still gets access the way it always did — an existing key, a password, or a provider's console. This decision makes the SECOND and later Macs cheap; it does not make the first one free, and claiming otherwise would be the kind of overstatement the rest of this record exists to avoid.

authorized_keys grows with the number of Macs rather than staying at one line. That is the honest shape of per-machine identity, and it makes the marker comment load-bearing: an entry nobody can attribute is an entry nobody will dare remove.

Revocation still requires reaching every host. Per-machine keys make revocation SAFER, not easier — the work is the same and the collateral damage is smaller.

Hosts Synapty does not manage still need manual enrolment: a jump host, a box reachable only by password, anything where the human is not already able to run a command. The feature degrades to today's behaviour there, and must say so rather than appear to have covered it.

NEW OBLIGATION, taken on deliberately: the workbench must be able to state, per host, what it cannot do ON THIS MACHINE and why — and separately for the two consumers, because "you cannot open a terminal here" and "the workbench cannot deploy here" have different causes and different remedies. Without that, this decision converts a connection failure into a subtler one: a host that looks ready and is not."""

[[content.alternatives]]
text = "Path-only, as today: sync the host row and let sshKeyPath name a key the new Mac may not have. Rejected — it is the status quo restated, and it delivers a host list you can read and cannot connect with, which is most of the friction sync was meant to remove."
status = "rejected"

[[content.alternatives]]
text = "Sync the private key material via iCloud Keychain (kSecAttrSynchronizable), Termius's model with Apple's end-to-end encryption instead of a vendor's servers. Rejected on BLAST RADIUS rather than on transport: a key reaching every Mac on an Apple ID makes one compromised Mac fleet-wide SSH access, where today a key on one Mac is a key on one Mac. It would also make Synapty a custodian of key material — rotation, passphrase handling, secure deletion — obligations this project would acquire by accident rather than by decision."
status = "rejected"

[[content.alternatives]]
text = "Store the private key in a CloudKit record, encrypted with CKRecord.encryptedValues. Rejected for the same blast-radius reason as iCloud Keychain, and additionally because it is the weaker of the two: Keychain is Apple's designed home for secrets, and choosing the record store would be inventing a second one to avoid a dependency that is already present."
status = "rejected"

[[content.alternatives]]
text = "Per-machine keys, syncing only the public half, with enrolment as an explicit human act. ACCEPTED — a new Mac becomes usable without any secret being copied by any route, revocation becomes per-machine, and the workbench never holds key material. It does not solve the FIRST Mac, and the record says so."
status = "accepted"
