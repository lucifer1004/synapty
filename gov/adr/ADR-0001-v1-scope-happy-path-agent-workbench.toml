#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0001"
title = "V1 Scope — Happy-Path Agent Workbench"
status = "proposed"
date = "2026-03-26"
refs = ["RFC-0001"]

[content]
context = """
[[RFC-0001]] defines a five-layer vision for Synapty as the ultimate agent workbench. We need to define V1 scope: the minimum deliverable that makes Synapty functional for real multi-agent workflows while not blocking extension to V2 and beyond.

### Problem Statement

A user has Claude Code running locally and Codex running on a remote machine. Today, these agents cannot communicate with each other. The user has no unified view of what each agent is doing and no efficient way to supervise both simultaneously.

V1 must solve this end-to-end scenario: two agents (local + remote), structured communication between them, Synapty-managed connectivity, and a human-friendly GUI for supervision.

### Constraints

- [[RFC-0001:C-NON-GOALS]] prohibits Synapty from becoming an LLM runtime, IDE, or agent implementation framework.
- Pure Zig, zero external runtime dependencies (per project rules).
- V1 is happy-path only — no retry queues, encrypted handshakes, or complex failure tolerance.
- libghostty-vt integration is a substantial effort. Its inclusion or exclusion in V1 significantly affects the scope of L0, L2, and L3 capabilities.
- Existing agents (Claude Code, Codex) are unmodified — integration happens via CLI tools and agent skills/plugins, not by patching the agents themselves.

### Options Considered

Three scoping strategies were evaluated: minimal router (L4 only), CLI-first workbench (L1 + L4 + GUI), and full-stack with libghostty-vt (L0–L4)."""
decision = """
We will **build V1 as a CLI-first agent workbench with managed SSH connectivity and a human-friendly GUI**, delivering functional multi-agent orchestration without libghostty-vt integration.

V1 delivers five components:

1. **Synapty Hub** — A2A message router listening on TCP. Maintains an in-memory routing table mapping agent IDs to connections. Parses envelope headers for routing, forwards payloads without deserialization. Runs locally by default but the design does not assume locality.

2. **Synapty CLI (`synapty`)** — The universal agent integration surface. Commands:
   - `synapty register <agent-id> [--capabilities ...]` — connect to Hub and register
   - `synapty send <target> <payload>` — send an A2A envelope
   - `synapty recv [--wait]` — receive incoming messages (poll or block)
   - `synapty agents` — list registered agents and capabilities
   - `synapty deploy <host>` — SSH into a remote machine, set up reverse tunnel, start daemon

   Agents interact with Synapty exclusively through this CLI. This means any agent that can execute shell commands — Claude Code via skills, Codex via plugins, or any custom script — can participate without modification.

3. **Synapty Daemon** — A lightweight binary deployed on remote machines by `synapty deploy`. It:
   - Establishes an SSH reverse tunnel back to the Hub
   - Registers itself as an agent (or proxy for agents on that host)
   - Exposes the same CLI interface locally on the remote machine so remote agents use identical commands

4. **GUI** — A human-friendly interface for multi-agent supervision. The V1 GUI is scoped to essential information display: agent list with connection status, real-time message log between agents, and basic intervention controls (send a message as the human operator). The full vertical command cockpit with notification rings and OSC-driven attention routing is V2. The GUI technology (TUI, web dashboard, or native) will be decided in a follow-up ADR.

5. **Agent Skills** — Skill and plugin definitions that teach existing agents how to use the `synapty` CLI. Each skill is a declarative file shipped in the Synapty repository (e.g., a Claude Code SKILL.md, a Codex plugin manifest) that describes the available commands, their semantics, and example workflows. Skills cover the full round-trip: registration, sending messages to other agents, receiving and processing incoming messages, and querying the agent list. The exact skill format per agent platform will be specified in a follow-up ADR.

### What V1 explicitly defers

- **L0 (libghostty-vt):** No VT state machine integration. Terminal output is raw byte passthrough. SIMD parsing, security sandbox, and grapheme clustering are V2.
- **L2 (OSC bus):** No in-band OSC signaling. Agent communication is CLI-based, not escape-sequence-based. OSC interception is V2.
- **L3 (Terminal introspection):** No 2D DOM export. Agents cannot query terminal grid state. This requires L0 and is V2.
- **WebSocket framing:** V1 uses raw TCP with JSON envelopes. WebSocket upgrade is V2.
- **Agent discovery/query:** V1 supports `synapty agents` to list, but no capability-based query routing. V2.
- **Failure tolerance:** No retry queues, reconnection logic, or session persistence across crashes. V2.
- **Encryption/authentication:** Hub trusts all connections. V2.

### V2 extension path (not blocked by V1 decisions)

- The A2A envelope format is the same whether carried over raw TCP, WebSocket, or SSH tunnel — V2 transport upgrades require no protocol change.
- The CLI integration model coexists with future OSC-based signaling — adding L0/L2 gives agents a second, lower-friction communication path without removing the CLI.
- The Hub routing table interface can be swapped from in-memory HashMap to a persistent or distributed implementation without changing the routing logic.
- The GUI can evolve from a basic agent dashboard to the full vertical command cockpit with notification rings as L0/L2 come online.
- Daemon-per-session process management (full L1) layers on top of the existing daemon + SSH tunnel infrastructure."""
consequences = """
### Positive

- **End-to-end functional from V1.** A user can run Claude Code locally, Codex remotely, and have them exchange messages through Synapty with a single `synapty deploy` command.
- **Zero agent modification.** Integration via CLI skills means any agent that can run shell commands participates. No forking, patching, or custom SDKs.
- **GUI from day one.** Human supervision is not an afterthought — operators get visibility into multi-agent workflows immediately.
- **Clean V2 path.** Every V1 component has a natural upgrade path. Nothing in V1 needs to be torn out to add libghostty-vt, OSC, or WebSocket support.

### Negative

- **No terminal awareness.** Without libghostty-vt, Synapty cannot inspect terminal state, intercept escape sequences, or provide 2D DOM introspection. Agents communicate through explicit CLI calls only — they cannot participate in orchestration simply by printing to stdout. (Mitigation: the CLI path remains valid in V2; agents that adopt it now continue to work.)
- **CLI overhead per message.** Each send/recv spawns a CLI process and opens a TCP connection. This adds latency compared to a persistent daemon-managed channel or in-band OSC signaling. (Mitigation: acceptable for the human-supervised, moderate-throughput V1 workload. V2's persistent daemon connections and OSC bus address this.)
- **Daemon is SSH-only for remote.** V1 remote connectivity requires SSH access. Environments without SSH (e.g., browser-based agents, serverless) cannot participate. (Mitigation: SSH covers the primary use case — remote development machines. Alternative transports are V2.)
- **GUI scope risk.** Committing to a GUI in V1 adds significant surface area. An under-invested GUI may be worse than no GUI. (Mitigation: V1 GUI is explicitly scoped to agent list, message log, and basic intervention — not the full vertical cockpit.)

### Neutral

- The daemon binary pivots from a process-wrapper (bootstrap design) to an SSH tunnel manager + remote CLI host. The bootstrap code for process spawning is not wasted — it moves to V2's daemon-per-session implementation.
- The `synapty` CLI becomes a third executable alongside `synapty-hub` and `synapty-daemon`.
- The CLI-based integration path becomes a de facto permanent interface contract. Even after V2 delivers OSC-based signaling, agents that adopted the CLI in V1 will expect it to remain supported. This means the CLI is not a temporary scaffold — it is a long-term supported surface."""

[[content.alternatives]]
text = "Minimal router (L4 only): Build only the Hub and CLI with no GUI, no SSH management, and no daemon. Agents connect directly to the Hub over raw TCP."
status = "rejected"
pros = [
    "Smallest scope, fastest to ship",
    "Focuses engineering effort on protocol correctness",
]
cons = [
    "No human supervision — operators must manually check each agent session",
    "Remote agents require user to manually set up SSH tunnels",
    "Does not deliver on the RFC-0001 vision of human experience as a core pillar",
]
rejection_reason = "Fails the core scenario: a user supervising Claude Code + Codex needs visibility and managed connectivity, not just a message pipe."

[[content.alternatives]]
text = "Full-stack with libghostty-vt (L0–L4): Integrate libghostty-vt from V1, enabling OSC interception, terminal introspection, and the full vertical cockpit with notification rings."
status = "rejected"
pros = [
    "Delivers the complete RFC-0001 vision in a single release",
    "Agents can participate via stdout OSC sequences — zero CLI overhead",
    "2D DOM introspection available from day one",
]
cons = [
    "libghostty-vt C binding integration is a major engineering effort with uncertain timeline",
    "Blocks V1 delivery on the slowest dependency",
    "Higher risk of V1 shipping late or incomplete",
]
rejection_reason = "libghostty-vt integration is the long pole. Coupling V1 to it risks delivering nothing while attempting everything. The CLI-first approach delivers a functional workbench now and adds VT capabilities in V2 without protocol changes."
