name: Synapty
options:
  bundleIdPrefix: com.synapty
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_OBJC_BRIDGING_HEADER: Synapty-Bridging-Header.h
    HEADER_SEARCH_PATHS: $(PROJECT_DIR)
    CLANG_ENABLE_MODULES: NO

targets:
  Synapty:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: scripts
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.synapty.app
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_OBJC_BRIDGING_HEADER: Synapty-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)
        FRAMEWORK_SEARCH_PATHS:
          - $(PROJECT_DIR)
        OTHER_LDFLAGS:
          - "-lc++"
          - "-framework"
          - Metal
          - "-framework"
          - QuartzCore
          - "-framework"
          - IOSurface
          - "-framework"
          - UniformTypeIdentifiers
          - "-framework"
          - Carbon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    postBuildScripts:
      - script: |
          for target in linux-aarch64 linux-x86_64 linux-riscv64 macos-aarch64 macos-x86_64; do
            SRC="${SRCROOT}/zig-out/${target}/synapty"
            DEST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/deploy/${target}"
            if [ -f "$SRC" ]; then
              mkdir -p "$DEST"
              cp "$SRC" "$DEST/synapty"
            fi
          done
          # Bundle the unified synapty binary ([[ADR-0004]]: hub is `synapty hub`).
          # Must live in Contents/MacOS/ (standard Mach-O location): a bare
          # executable copied into Contents/Resources/ is not covered by the
          # app signature, and Apple System Policy kills it on exec
          # ("load code signature error 2"). In MacOS/ it is sealed as a
          # nested helper and executes fine.
          BIN_SRC="${SRCROOT}/zig-out/bin/synapty"
          BIN_DEST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS"
          if [ -f "$BIN_SRC" ]; then
            # Name must not collide with the main executable: APFS is
            # case-insensitive, so "synapty" would overwrite "Synapty".
            cp "$BIN_SRC" "$BIN_DEST/synapty-cli"
          fi
        name: Bundle deploy and hub binaries
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
        link: true

  SynaptyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.synapty.tests
    dependencies:
      - target: Synapty
