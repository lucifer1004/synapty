name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install xcodegen + just
        run: brew install xcodegen just

      # THE RELEASE FAILS WITHOUT CREDENTIALS. `just package` refuses to
      # produce an artifact it cannot sign and notarize, so this job is red
      # until the repository carries the five secrets below — which is the
      # right colour for a release nobody could open ([[WI-2026-09-02-028]]).
      #   APPLE_CERTIFICATE_P12       base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  its password
      #   APPLE_ID / APPLE_TEAM_ID    the notarizing account
      #   APPLE_APP_PASSWORD          an app-specific password for it
      - name: Import the signing identity and notary credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for v in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set; a release cannot be signed and notarized without it"
              exit 1
            fi
          done
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          xcrun notarytool store-credentials synapty-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      # The post-build script bundles zig-out/bin/synapty into the app at
      # Contents/Helpers/synapty — build it BEFORE xcodebuild, or the app
      # ships whatever the last run left there. The deploy targets are not
      # built here: `just package` depends on `deploy-all`, which builds
      # the same five.
      - name: Build local synapty binary
        run: zig build

      - name: Build GhosttyKit.xcframework
        run: just ghosttykit

      # The tag is handed in for the skew check only: the version itself
      # comes from build.zig.zon, and `just package` refuses a tag that
      # names anything else.
      - name: Package app + DMG + zip + cask
        run: SYNAPTY_VERSION="$GITHUB_REF_NAME" just package

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            zig-out/package/*.dmg
            zig-out/package/*.zip
            zig-out/package/synapty.rb
