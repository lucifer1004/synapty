name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          zig-version: 0.16.0

      - name: Zig tests
        run: zig build test --summary all

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Swift tests
        run: |
          xcodebuild -project Synapty.xcodeproj -scheme Synapty \
            -configuration Debug -only-testing:SynaptyTests test
